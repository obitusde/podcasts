# Erkennt zweimal täglich Werbeblöcke und Themen in den neuesten Folgen
# (siehe tools/analyze.mjs) und schreibt das Ergebnis nach data/analysis.json.
# Die Webseite liest diese Datei und überspringt damit die Werbung.
#
# Einmalig nötig: Repository-Secret OPENROUTER_API_KEY anlegen unter
# Settings -> Secrets and variables -> Actions -> New repository secret
name: Podcast-Analyse

on:
  schedule:
    # Zeiten in UTC. Morgens im Halbstundentakt, bis die Folge des Tages da
    # ist: Der erste Lauf, der sie findet, analysiert sie; alle weiteren
    # Läufe sehen "schon analysiert" und enden nach dem Feed-Abruf. Gibt es
    # an dem Tag keine neue Folge, passiert gar nichts.
    # (GitHub startet geplante Läufe oft 5-15 Minuten später als angegeben.)
    - cron: '0,30 3-7 * * *'  # 4:00 bis 8:30 deutscher Zeit
    - cron: '0 11 * * *'      # Sicherheitsnetz am Mittag
  workflow_dispatch:       # erlaubt das Starten von Hand
    inputs:
      force:
        description: 'Schon analysierte Folgen neu analysieren'
        type: boolean
        default: false
      episodes:
        description: 'Wie viele der neuesten Folgen (leer = wie konfiguriert)'
        type: string
        default: ''
      debug:
        description: 'Komplettes Transkript ins Protokoll schreiben'
        type: boolean
        default: false
      stt:
        description: 'Transkriptionsmodell erzwingen (leer = automatisch)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: podcast-analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Folgen analysieren
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          EPISODES: ${{ inputs.episodes }}
          DEBUG: ${{ inputs.debug && '1' || '0' }}
          STT: ${{ inputs.stt }}
        run: node tools/analyze.mjs

      - name: Ergebnis committen
        run: |
          git config user.name "podcast-analyse"
          git config user.email "actions@users.noreply.github.com"
          git add data/analysis.json
          if git diff --staged --quiet; then
            echo "Keine Änderung."
          else
            git commit -m "Werbe- und Themen-Analyse aktualisiert"
            git pull --rebase origin main
            git push
          fi
