# Erkennt mehrmals täglich Werbeblöcke und Themen in den neuesten Folgen
# (siehe tools/analyze.mjs) und schreibt das Ergebnis nach data/analysis.json.
# Die Webseite liest diese Datei und überspringt damit die Werbung.
#
# Einmalig nötig: Repository-Secret OPENROUTER_API_KEY anlegen unter
# Settings -> Secrets and variables -> Actions -> New repository secret
name: Podcast-Analyse

on:
  schedule:
    # Zeiten in UTC. Wann die Folgen erscheinen (deutsche/Schweizer Zeit):
    #   Handelsblatt Morning Briefing  5:52 bis 5:57
    #   HeuteMorgen (SRF)              6:00
    #   Echo der Zeit (SRF)           18:00, sonntags zusätzlich 7:00
    #
    # Die Minuten sind bewusst krumm. GitHub stellt geplante Läufe in eine
    # gemeinsame Warteschlange; zur vollen und zur halben Stunde planen alle,
    # dort werden Läufe um Stunden verschoben oder ganz verworfen. Dazwischen
    # ist es ruhiger.
    #
    # Dass hier viele Läufe stehen, ist Absicht und kostet fast nichts: Ein
    # Lauf ohne neue Folge endet nach dem Feed-Abruf in rund einer halben
    # Minute, und öffentliche Repositories zahlen keine Minuten. Mehrere
    # Versuche sind die einzige Versicherung dagegen, dass GitHub einzelne
    # davon verschluckt.
    #
    # 4-8 UTC deckt beide Zeitumstellungen ab: im Winter 5:09 bis 9:49
    # deutscher Zeit, im Sommer 6:09 bis 10:49. Die frühen Läufe laufen in
    # der Winterzeit ins Leere, das ist der Preis für einen Zeitplan, der
    # zweimal im Jahr nicht angefasst werden muss.
    - cron: '9,29,49 4-8 * * *'
    - cron: '13 11 * * *'        # Sicherheitsnetz am Mittag
    # Echo der Zeit erscheint um 18:00 und wäre am nächsten Morgen schon zu
    # alt für die Altersgrenze (14 Stunden). Diese Läufe holen es am selben
    # Abend; 16 UTC greift in der Sommerzeit, 18 UTC in der Winterzeit.
    - cron: '19 16,18,20 * * *'
    - cron: '49 17,19,21 * * *'
  workflow_dispatch:       # erlaubt das Starten von Hand
    inputs:
      force:
        description: 'Schon analysierte Folgen neu analysieren'
        type: boolean
        default: false
      episodes:
        description: 'Wie viele der neuesten Folgen (leer = wie konfiguriert)'
        type: string
        default: ''
      debug:
        description: 'Komplettes Transkript ins Protokoll schreiben'
        type: boolean
        default: false
      stt:
        description: 'Transkriptionsmodell erzwingen (leer = automatisch)'
        type: string
        default: ''
      podcast:
        description: 'Nur diesen Podcast (ID oder Name, leer = alle)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: podcast-analyse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ffmpeg misst die Sprechpausen, an denen die Abschnittsgrenzen sitzen.
      # Auf dem Runner-Image ist es NICHT vorinstalliert - ohne diesen Schritt
      # scheitert die Messung still und es greift die ungenaue Rückfallebene.
      - name: ffmpeg installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      # Erst die Tabelle lesen, damit der Lauf mit dem arbeitet, was gerade
      # in der Konfiguration steht. Schlaegt das fehl, gilt der letzte Stand
      # aus dem Repository - der Lauf soll daran nicht scheitern.
      - name: Konfiguration aus der Tabelle holen
        continue-on-error: true
        run: node tools/sync-config.mjs

      - name: Folgen analysieren
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Damit die geschnittene Tondatei als Anhang abgelegt werden kann
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          EPISODES: ${{ inputs.episodes }}
          DEBUG: ${{ inputs.debug && '1' || '0' }}
          STT: ${{ inputs.stt }}
          ONLY: ${{ inputs.podcast }}
        run: node tools/analyze.mjs

      - name: Ergebnis committen
        run: |
          git config user.name "podcast-analyse"
          git config user.email "actions@users.noreply.github.com"
          git add data/analysis.json data/config.json
          if git diff --staged --quiet; then
            echo "Keine Änderung."
            exit 0
          fi
          git commit -m "Werbe- und Themen-Analyse aktualisiert"

          # Beim Schreiben kann in der Zwischenzeit ein anderer Lauf
          # geschrieben haben. Dann gewinnt die eigene, frisch berechnete
          # Fassung (-X theirs bezieht sich beim Rebase auf den eigenen
          # Commit). Drei Versuche, danach lieber abbrechen als Murks
          # committen.
          for versuch in 1 2 3; do
            if git push; then
              echo "Gespeichert (Versuch $versuch)."
              exit 0
            fi
            echo "Push fehlgeschlagen - neuer Stand wird geholt."
            git pull --rebase -X theirs origin main || git rebase --abort
          done
          echo "::error::Konnte das Ergebnis nicht speichern."
          exit 1
