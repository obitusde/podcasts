# Erkennt Werbeblöcke und Themen in den neuesten Folgen (siehe
# tools/analyze.mjs) und schreibt das Ergebnis nach data/analysis.json.
# Die Webseite liest diese Datei und überspringt damit die Werbung.
#
# Der Lauf startet NUR auf Anfrage: Die App fragt beim Öffnen, ob die
# Podcasts bearbeitet werden sollen, und stösst den Lauf bei "Ja" über das
# Apps Script an (Code.gs, ?mode=analyse). Es gibt keine Zeitpläne mehr -
# die Analyse kostet Geld (Transkription und Textmodell), und es wird nur
# bezahlt, was jemand hören will.
#
# Ohne die Angabe "anfrage" tut der Lauf nichts und kostet nichts. Das fängt
# auch alte Zeitauslöser ab, die vielleicht noch im Apps Script stehen
# (Wecker.gs): Ihr Aufruf kommt ohne "anfrage" und wird übersprungen.
#
# Einmalig nötig: Repository-Secret OPENROUTER_API_KEY anlegen unter
# Settings -> Secrets and variables -> Actions -> New repository secret
name: Podcast-Analyse

on:
  workflow_dispatch:
    inputs:
      anfrage:
        description: 'Wirklich starten (die App setzt das; von Hand bitte anhaken)'
        type: boolean
        default: false
      force:
        description: 'Schon analysierte Folgen neu analysieren'
        type: boolean
        default: false
      episodes:
        description: 'Wie viele der neuesten Folgen (leer = wie konfiguriert)'
        type: string
        default: ''
      debug:
        description: 'Komplettes Transkript ins Protokoll schreiben'
        type: boolean
        default: false
      stt:
        description: 'Transkriptionsmodell erzwingen (leer = automatisch)'
        type: string
        default: ''
      podcast:
        description: 'Nur diesen Podcast (ID oder Name, leer = alle)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: podcast-analyse
  cancel-in-progress: false

jobs:
  analyse:
    # Ohne "anfrage" wird der Job übersprungen.
    if: ${{ inputs.anfrage }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ffmpeg misst die Sprechpausen, an denen die Abschnittsgrenzen sitzen.
      # Auf dem Runner-Image ist es NICHT vorinstalliert - ohne diesen Schritt
      # scheitert die Messung still und es greift die ungenaue Rückfallebene.
      #
      # Es kommt als fertige Datei von GitHub selbst (Sekunden). Die frühere
      # Installation über apt hat zweimal 15 bis 25 Minuten gebraucht, weil
      # die Paketquelle langsam war; bei einer Analyse, auf die jemand im
      # Auto wartet, geht das nicht. apt bleibt als Ausweg, falls der
      # Download einmal nicht klappt.
      - name: ffmpeg bereitstellen
        timeout-minutes: 10
        run: |
          mkdir -p "$HOME/ffmpeg-bin"
          URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          if curl -fsSL --retry 3 --retry-delay 2 --max-time 180 -o /tmp/ffmpeg.tar.xz "$URL" \
             && tar -xJf /tmp/ffmpeg.tar.xz --strip-components=2 -C "$HOME/ffmpeg-bin" --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' \
             && "$HOME/ffmpeg-bin/ffmpeg" -version >/dev/null 2>&1 \
             && "$HOME/ffmpeg-bin/ffprobe" -version >/dev/null 2>&1; then
            echo "$HOME/ffmpeg-bin" >> "$GITHUB_PATH"
            "$HOME/ffmpeg-bin/ffmpeg" -version | head -1
          else
            echo "Direktdownload fehlgeschlagen - Installation über apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
            ffmpeg -version | head -1
          fi

      # Erst die Tabelle lesen, damit der Lauf mit dem arbeitet, was gerade
      # in der Konfiguration steht. Schlaegt das fehl, gilt der letzte Stand
      # aus dem Repository - der Lauf soll daran nicht scheitern.
      - name: Konfiguration aus der Tabelle holen
        continue-on-error: true
        run: node tools/sync-config.mjs

      # Nach der Analyse wird sofort gespeichert, damit die App die fertige
      # Folge bekommt.
      - name: Folgen analysieren und speichern
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Damit die geschnittene Tondatei als Anhang abgelegt werden kann
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          EPISODES: ${{ inputs.episodes }}
          DEBUG: ${{ inputs.debug && '1' || '0' }}
          STT: ${{ inputs.stt }}
          ONLY: ${{ inputs.podcast }}
        run: |
          git config user.name "podcast-analyse"
          git config user.email "actions@users.noreply.github.com"
          node tools/analyze.mjs
          bash tools/speichern.sh
