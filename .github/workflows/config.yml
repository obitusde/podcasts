# Holt die Konfiguration aus der Google-Tabelle und schreibt sie ins
# Repository. Von Hand starten unter Actions -> Konfiguration uebernehmen,
# wenn eine Aenderung in der Tabelle sofort greifen soll. Sonst passiert es
# ohnehin bei jedem Analyse-Lauf.
name: Konfiguration uebernehmen

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast-konfiguration
  cancel-in-progress: false

jobs:
  konfiguration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tabelle lesen
        run: node tools/sync-config.mjs
      - name: Ergebnis committen
        run: |
          git config user.name "podcast-konfiguration"
          git config user.email "actions@users.noreply.github.com"
          git add data/config.json
          if git diff --staged --quiet; then
            echo "Keine Aenderung."
            exit 0
          fi
          git commit -m "Konfiguration aus der Tabelle uebernommen"
          for versuch in 1 2 3; do
            if git push; then
              echo "Gespeichert (Versuch $versuch)."
              exit 0
            fi
            echo "Push fehlgeschlagen - neuer Stand wird geholt."
            git pull --rebase -X theirs origin main || git rebase --abort
          done
          echo "::error::Konnte die Konfiguration nicht speichern."
          exit 1
