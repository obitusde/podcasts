<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcasts – Neueste Folgen</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101214">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0d0f11;          /* Seitenhintergrund, dunkelster Ton */
    --bg-elevated: #2d343c; /* Kacheln - deutlich heller als die Seite */
    --border: #434b54;
    --text: #ffffff;        /* reines Weiss für maximalen Kontrast */
    --text-dim: #c3cad2;    /* Nebentext: hell genug, um gut lesbar zu sein */
    --accent: #ff8b5c;
    --accent-dim: #8a4526;
    /* Player-Leiste: nochmals deutlich heller, damit sie sich klar von
       Seite und Kacheln abhebt. */
    --player-bg: #39434f;
    --player-border: #6b7889;
    --player-btn-bg: #151a20; /* dunkle Knöpfe auf hellem Player = hoher Kontrast */
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  header {
    padding: 28px 20px 16px;
    max-width: 900px;
    margin: 0 auto;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }

  header p {
    color: var(--text-dim);
    font-size: 13px;
    margin: 0;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    /* Seitlich fast randlos, damit die Kacheln die volle Breite nutzen.
       Unten ist der Wert nur ein Fallback - er wird per JS auf die echte
       Höhe der Player-Leiste gesetzt. */
    padding: 12px 6px 100px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 16px;
  }

  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: stretch;
    transition: border-color 0.15s ease, transform 0.1s ease;
    text-align: left;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .card:active {
    transform: scale(0.98);
  }

  .card.active {
    border-color: var(--accent);
  }

  /* Zeile unter dem Podcast-Namen: Bild + Titel/Datum */
  .card-body {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .card img {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--border);
    -webkit-user-drag: none;
    user-drag: none;
  }

  .card-text {
    min-width: 0;
    flex: 1;
  }

  .card-podcast {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-title {
    font-size: 14px;
    font-weight: 500;
    margin: 0 0 3px;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-date {
    font-size: 12.5px;
    color: var(--text-dim);
    margin: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .card-listened {
    color: var(--accent);
    font-size: 12px;
  }

  .card.error {
    opacity: 0.5;
    cursor: default;
  }

  .card.loading .card-title { color: var(--text-dim); }

  .card.error { opacity: 0.75; }

  /* Player */
  #player-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--player-bg);
    border-top: 2px solid var(--player-border);
    box-shadow: 0 -10px 24px rgba(0, 0, 0, 0.5);
    /* Unten wenig Rand, damit die Knöpfe nah an den Daumen rücken. */
    padding: 8px 16px calc(6px + env(safe-area-inset-bottom, 0px));
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }

  #player-bar.visible {
    transform: translateY(0);
  }

  /* Beim Scrollen nach oben (Podcast aussuchen) fährt die Leiste weg und
     gibt die Kacheln frei; beim Scrollen nach unten kommt sie zurück.
     Die ID vorne sorgt dafür, dass diese Regel .visible überstimmt. */
  #player-bar.visible.scrolled-away {
    transform: translateY(100%);
  }

  .player-inner {
    max-width: 900px;
    margin: 0 auto;
  }

  .player-info {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .player-info img {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .player-info-text {
    min-width: 0;
    flex: 1;
  }

  #player-podcast {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin: 0;
  }

  /* Schliessen-Knopf: blendet die Leiste aus, die Folge läuft weiter.
     Zurück kommt sie mit einem Tipp auf den laufenden Podcast. */
  .close-btn {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--player-btn-bg);
    border: 2px solid var(--text);
    color: var(--text);
    font-size: 24px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    font-family: inherit;
  }

  .close-btn:active {
    background: var(--accent);
    border-color: var(--accent);
    color: #101214;
  }

  #player-title {
    font-size: 14px;
    margin: 2px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Das <audio>-Element bleibt unsichtbar: die nativen Controls sind auf
     dem Handy klein und lassen sich nicht vergrössern. Gesteuert wird
     über die eigenen Knöpfe darunter. */
  audio {
    display: none;
  }

  /* Themenliste: alle Themen der Folge (in der Sammlung: alle Beiträge),
     das laufende hervorgehoben. Drei Zeilen sind sichtbar, der Rest
     scrollt; ein Tipp auf eine Zeile springt dorthin. */
  .chapter-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
    margin-bottom: 6px;
  }

  .chapter-row[hidden] {
    display: none;
  }

  .chapter-list {
    flex: 1;
    min-width: 0;
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 114px;   /* drei Zeilen à 38px */
    overflow-y: auto;
    overscroll-behavior: contain;
    border-radius: 10px;
    background: var(--player-btn-bg);
    position: relative;  /* Bezug für offsetTop der Zeilen */
  }

  .chapter-list button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 38px;
    padding: 6px 10px;
    border: none;
    border-left: 4px solid transparent;
    background: transparent;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 14px;
    text-align: left;
    cursor: pointer;
  }

  .chapter-list li + li button {
    border-top: 1px solid #262d35;
  }

  .chapter-list .zeit {
    flex-shrink: 0;
    min-width: 36px;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    opacity: 0.85;
  }

  .chapter-list .titel {
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chapter-list li.jetzt button {
    color: var(--text);
    font-weight: 700;
    border-left-color: var(--accent);
    background: rgba(255, 139, 92, 0.14);
  }

  .chapter-list button:active {
    background: var(--accent-dim);
  }

  .chapter-btn {
    flex-shrink: 0;
    background: var(--player-btn-bg);
    border: 1px solid var(--player-border);
    color: var(--text);
    border-radius: 10px;
    padding: 0 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    /* Wort über dem Symbol: schmal, damit die Titel mehr Platz haben */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 64px;
  }

  .chapter-btn .symbol {
    font-size: 20px;
    line-height: 1;
  }

  .chapter-btn:active {
    background: var(--accent-dim);
  }

  /* Fortschrittsbalken mit Zeitangaben */
  .seek-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .seek-row .time {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    min-width: 44px;
    text-align: center;
  }

  #seek {
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    height: 28px; /* grosse Trefferfläche für den Finger */
    margin: 0;
    cursor: pointer;
  }

  #seek::-webkit-slider-runnable-track {
    height: 8px;
    border-radius: 4px;
    background: var(--player-btn-bg);
  }

  #seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px;
    height: 24px;
    margin-top: -8px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
  }

  #seek::-moz-range-track {
    height: 8px;
    border-radius: 4px;
    background: var(--player-btn-bg);
  }

  #seek::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
  }

  /* Grosser Play/Pause-Knopf, flankiert von Folgen-Navigation */
  .transport {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .play-btn {
    width: 66px;
    height: 66px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #101214;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
  }

  .play-btn svg {
    width: 32px;
    height: 32px;
    fill: currentColor;
  }

  .play-btn:active {
    transform: scale(0.96);
  }

  .ep-btn {
    flex: 1 1 0;
    min-width: 0;
    background: var(--player-btn-bg);
    border: 1px solid var(--player-border);
    color: var(--text);
    border-radius: 10px;
    padding: 13px 6px;
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    font-family: inherit;
  }

  .ep-btn:disabled {
    opacity: 0.45;
    cursor: default;
  }

  .ep-btn:not(:disabled):active {
    background: var(--accent-dim);
  }

  /* Kopfzeile mit Aktualisieren-Knopf */
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .icon-btn {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
  }

  .icon-btn.busy {
    opacity: 0.4;
  }

  .controls {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 8px;
    flex-wrap: nowrap;
  }

  .controls button {
    flex: 1 1 0;
    min-width: 0;
    background: var(--player-btn-bg);
    border: 1px solid var(--player-border);
    color: var(--text);
    border-radius: 10px;
    padding: 13px 4px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }

  .controls button:active {
    background: var(--accent-dim);
  }

  /* Hover/Tap-Verhalten
     --------------------
     Mobile Browser lassen :hover nach einem Tap "kleben" - Knöpfe blieben
     dadurch dauerhaft orange. Hover-Effekte deshalb nur auf Geräten mit
     echtem Zeiger (Maus/Trackpad); auf Touch zählt nur :active, das
     ausschliesslich beim Drücken gilt. */
  button {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  @media (hover: hover) and (pointer: fine) {
    .card:hover { border-color: var(--accent-dim); }
    .card.error:hover { border-color: var(--border); }
    .controls button:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  }

  .status {
    color: var(--text-dim);
    font-size: 13px;
    padding: 20px 0;
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1 id="today-date"></h1>
    <button id="refresh" class="icon-btn" aria-label="Folgen neu laden" title="Folgen neu laden">&#x21bb;</button>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div id="player-bar">
  <div class="player-inner">
    <div class="player-info">
      <img id="player-img" src="" alt="">
      <div class="player-info-text">
        <p id="player-podcast"></p>
        <p id="player-title"></p>
      </div>
      <button id="player-close" class="close-btn" aria-label="Player ausblenden" title="Player ausblenden">&times;</button>
    </div>
    <audio id="audio" preload="metadata"></audio>

    <!-- Themen der Folge (in der Sammlung: ihre Beiträge). Wird
         ausgeblendet, wenn es für die Folge keine Themen gibt. -->
    <div id="chapter-row" class="chapter-row" hidden>
      <ol id="chapter-list" class="chapter-list" aria-label="Themen"></ol>
      <button id="skip-chapter" class="chapter-btn" aria-label="Thema überspringen"><span>Thema</span><span class="symbol">&#9197;</span></button>
    </div>

    <div class="seek-row">
      <span id="time-current" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Position in der Folge">
      <span id="time-remaining" class="time">-0:00</span>
    </div>

    <div class="transport">
      <button id="prev-episode" class="ep-btn" aria-label="Ältere Folge">&#9664; älter</button>
      <button id="playpause" class="play-btn" aria-label="Abspielen"></button>
      <button id="next-episode" class="ep-btn" aria-label="Neuere Folge">neuer &#9654;</button>
    </div>

    <div class="controls">
      <button id="back10">-10s</button>
      <button id="back5">-5s</button>
      <button id="fwd5">+5s</button>
      <button id="fwd10">+10s</button>
      <button id="fwd30">+30s</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   KONFIGURATION
   ============================================================ */

// URL des Apps Script Web-App-Deployments (Code.gs), das die Feeds
// als JSON liefert. Muss mit "/exec" enden.
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyHk_vhnKMFkMp3M8KJiS2HDuOEVfysnmOJ6GBYZw2ovPQ-BXYZIXU06s9GbmowjdzX/exec";

// Liste der Podcasts. Einfach weitere Einträge {name, feed} hinzufügen.
// Diese Liste ist nur die Rückfallebene. Im Normalfall wird sie beim Start
// durch data/config.json ersetzt - die Datei kommt aus der Google-Tabelle
// (siehe tools/sync-config.mjs). Hier stehen die Werte, die galten, als die
// Tabelle eingeführt wurde; sie greifen nur, wenn die Datei fehlt.
let PODCASTS = [
  {
    name: "HeuteMorgen",
    feed: "https://www.srf.ch/feed/podcast/sd/179ababb-4b36-40b2-951d-92d5c207fe9f.xml"
  },
  {
    name: "Handelsblatt Morning Briefing",
    feed: "https://handelsblatt-morningbriefing.podigee.io/feed/mp3"
  },
  {
    name: "DLF Audiobeiträge",
    type: "dlf_audio" // Sonderfall: keine feste Feed-URL, siehe loadPodcast()
  },
  {
    name: "Kalenderblatt",
    feed: "https://www.deutschlandfunk.de/dlf-kalenderblatt-100.xml"
  },
  {
    name: "WDR Kabarett",
    // Derselbe Feed wie "Dieter Nuhr" unten, aber per titleExcludes genau
    // umgekehrt gefiltert: alle Kabarettisten AUSSER Dieter Nuhr.
    feed: "https://www1.wdr.de/mediathek/audio/wdr2/wdr2-kabarett/kabarett-podcast-100.podcast",
    titleExcludes: "Dieter Nuhr"
  },
  {
    name: "Dieter Nuhr",
    // WDR-2-Kabarett-Feed, aber per titleContains auf Dieter Nuhrs
    // Beiträge gefiltert (der Feed mischt mehrere Kabarettisten, jede
    // Episode ist im Titel mit "<Name>: ..." gekennzeichnet).
    feed: "https://www1.wdr.de/mediathek/audio/wdr2/wdr2-kabarett/kabarett-podcast-100.podcast",
    titleContains: "Dieter Nuhr"
  },
  {
    name: "DLF Nachrichten",
    feed: "https://www.deutschlandfunk.de/nachrichten-108.xml",
    minDurationSeconds: 420 // nur Ausgaben ab 7 Min. - Standardausgaben sind ~5 Min., lange sind 8-10 Min.
  },
  {
    name: "Kommentare und Themen der Woche",
    feed: "https://www.deutschlandfunk.de/kommentar-100.xml"
  }
];

// --- Werbung am Anfang/Ende abschneiden ---------------------------
// Manche Podcasts haben vorne und hinten Werbung. Pro Podcast-Name (muss
// exakt dem "name" oben entsprechen) lässt sich hier festlegen, ab welcher
// Sekunde abgespielt und nach welcher Sekunde gestoppt wird. Beim Erreichen
// von endSeconds gilt die Folge als gehört, und es geht genauso weiter wie
// am echten Dateiende (Autoplay-Modi eingeschlossen).
//
// Werte einfach hier anpassen - Schreibweise "Minuten * 60 + Sekunden".
// startSeconds: 0   -> von Anfang an spielen
// endSeconds: null  -> bis zum Dateiende spielen
// adRanges         -> zusätzliche Werbeblöcke MITTEN in der Folge, die
//                     übersprungen werden sollen: [[von, bis], ...]
const PODCAST_TRIM = {
  "Handelsblatt Morning Briefing": {
    // Aufbau der Sendung: Themenvorstellung (ab 0:00) - Werbung (0:38 bis
    // 1:43) - die Themen - Werbung am Schluss.
    // Die Themenvorstellung bleibt also drin; soll sie auch weg, einfach
    // den ersten Bereich auf [0, 1 * 60 + 43] ändern.
    startSeconds: 0,
    endSeconds:   9 * 60 + 5,                  // 9:05 - danach Werbung
    adRanges:     [[0 * 60 + 38, 1 * 60 + 43]] // Werbung nach der Themenvorstellung
  },
  "HeuteMorgen": {
    startSeconds: 29,           // 0:29 - davor Jingle/Vorspann
    endSeconds:   null          // bis zum Ende spielen
  }
};

// Aus der Tabelle: Name -> {startSeconds, endSeconds}. Die Werbebereiche
// mitten in einer Folge stehen weiterhin oben im Code - sie sind nur noch
// Rückfallebene für den Fall, dass keine Analyse vorliegt.
let CONFIG_TRIM = {};
// Podcasts, bei denen in der Tabelle "Werbung schneiden" steht. Nur deren
// Anbieter bauen Werbung dynamisch ein, sodass dieselbe Adresse
// unterschiedlich lange Dateien liefern kann (siehe checkAnalysisFitsFile).
let CONFIG_WERBUNG = new Set();

function getTrim(podcastName) {
  const ausTabelle = CONFIG_TRIM[podcastName];
  const festWerte = PODCAST_TRIM[podcastName];
  if (!ausTabelle) return festWerte || null;
  return {
    startSeconds: ausTabelle.startSeconds || 0,
    endSeconds: ausTabelle.endSeconds || null,
    adRanges: (festWerte && festWerte.adRanges) || []
  };
}

/* ------------------------------------------------------------------
   KONFIGURATION AUS DER GOOGLE-TABELLE
   Eine GitHub-Action liest die Tabelle und legt sie als data/config.json
   ab. Die App liest nur diese Datei: gleiche Adresse wie die App selbst,
   also kein CORS, und sie funktioniert auch dann, wenn Google gerade
   nicht erreichbar ist.
   ------------------------------------------------------------------ */

const CONFIG_URL = 'data/config.json';
const PODCAST_IDS_KEY = 'podcastNamesById_v1';

async function loadConfigFile() {
  let daten;
  try {
    const res = await fetch(CONFIG_URL + '?v=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    daten = await res.json();
  } catch (e) {
    console.log('Konfigurationsdatei nicht lesbar - es gilt die Liste im Code', e);
    return;
  }
  if (!daten || !Array.isArray(daten.podcasts) || daten.podcasts.length === 0) return;

  migratePodcastIds(daten.podcasts);

  PODCASTS = daten.podcasts.map((p) => {
    const eintrag = { id: p.id, name: p.name };
    if (p.feed) eintrag.feed = p.feed;
    if (p.type) eintrag.type = p.type;
    if (p.titleContains) eintrag.titleContains = p.titleContains;
    if (p.titleExcludes) eintrag.titleExcludes = p.titleExcludes;
    if (p.minDurationSeconds) eintrag.minDurationSeconds = p.minDurationSeconds;
    if (p.sammlung) eintrag.sammlung = true;   // liefert Beiträge für die Tagesliste
    return eintrag;
  });

  CONFIG_TRIM = {};
  CONFIG_WERBUNG = new Set(daten.podcasts.filter((p) => p.werbung).map((p) => p.name));
  daten.podcasts.forEach((p) => {
    if (p.startSeconds || p.endSeconds) {
      CONFIG_TRIM[p.name] = { startSeconds: p.startSeconds || 0, endSeconds: p.endSeconds || null };
    }
  });

  console.log('Konfiguration aus der Tabelle: ' + PODCASTS.length + ' Podcasts');
}

/**
 * Umbenennen gefahrlos machen.
 *
 * Gehört-Haken, Hörposition und Cover hängen am Podcast-NAMEN. Ändert sich
 * der Name in der Tabelle, wäre der Podcast für die App ein neuer und alles
 * Gehörte vergessen. Die ID-Spalte verhindert das: Zu jeder ID wird der
 * zuletzt benutzte Name gemerkt; weicht er ab, zieht alles Gespeicherte mit
 * auf den neuen Namen um.
 */
// Schlüssel aus der Zeit des Ziehgriffs. Die Reihenfolge kommt jetzt aus
// der Tabelle; die Reste werden einmal weggeräumt, damit im Speicher des
// Geräts nichts liegen bleibt, das nichts mehr bewirkt.
function removeOldOrderKeys() {
  ['podcastOrder_v1', 'podcastOrderFromSheet_v1'].forEach((key) => {
    try { localStorage.removeItem(key); } catch (e) {}
  });
}

function migratePodcastIds(podcasts) {
  let bekannt;
  try {
    bekannt = JSON.parse(localStorage.getItem(PODCAST_IDS_KEY)) || {};
  } catch (e) {
    bekannt = {};
  }

  const umzuege = [];
  podcasts.forEach((p) => {
    if (!p.id) return;
    const alt = bekannt[p.id];
    if (alt && alt !== p.name) umzuege.push([alt, p.name]);
    bekannt[p.id] = p.name;
  });

  umzuege.forEach(([alt, neu]) => {
    [STORAGE_KEY, IMAGE_KEY].forEach((key) => {
      let daten;
      try {
        daten = JSON.parse(localStorage.getItem(key));
      } catch (e) {
        return;
      }
      if (!daten || typeof daten !== 'object' || !daten[alt]) return;
      if (!daten[neu]) daten[neu] = daten[alt];
      delete daten[alt];
      try { localStorage.setItem(key, JSON.stringify(daten)); } catch (e) {}
    });
    console.log('Podcast umbenannt: "' + alt + '" -> "' + neu + '" (alles Gehörte bleibt erhalten)');
  });

  try { localStorage.setItem(PODCAST_IDS_KEY, JSON.stringify(bekannt)); } catch (e) {}
}

/* ------------------------------------------------------------------
   WERBEBEREICHE DER LAUFENDEN FOLGE
   Das Backend (Code.gs) erkennt pro Folge die Werbeblöcke - vorne,
   mitten drin und hinten - und liefert sie als Liste [[von, bis], ...]
   mit. Gibt es für eine Folge keine Analyse, werden die festen Werte
   aus PODCAST_TRIM oben in genau dieselbe Form gebracht. Von da an
   kennt der Player nur noch "Werbebereiche", die er überspringt.
   ------------------------------------------------------------------ */

let activeAdRanges = [];  // [[von, bis], ...] der laufenden Folge
let activeChapters = [];  // [{start, title}, ...] der laufenden Folge
let activeAnalysis = null; // die zugrunde liegende Analyse (für die Längenprüfung)
let activeClean = null;    // die geschnittene Fassung, wenn eine gespielt wird

// Baut die Werbebereiche einer Folge: erkannte Bereiche bevorzugt,
// sonst die festen Werte aus PODCAST_TRIM.
function buildAdRanges(podcastName, episode) {
  const analysis = analysisFor(episode);
  if (analysis && Array.isArray(analysis.adRanges) && analysis.adRanges.length > 0) {
    return analysis.adRanges
      .map((r) => [Number(r[0]), Number(r[1])])
      .filter((r) => isFinite(r[0]) && isFinite(r[1]) && r[1] > r[0])
      .sort((a, b) => a[0] - b[0]);
  }

  return buildAdRangesFromTrim(podcastName);
}

/**
 * Die werbefrei geschnittene Fassung dieser Folge, falls es eine gibt.
 *
 * Der Anbieter baut die Werbung bei jedem Abruf neu ein - dieselbe Adresse
 * lieferte innerhalb von zehn Minuten 595, 506 und 592 Sekunden lange
 * Dateien. Zeitmarken können dagegen nicht ankommen. Deshalb schneidet die
 * Analyse die Werbung heraus und legt die fertige Datei ab; hier wird sie
 * bevorzugt.
 */
function cleanVersion(episode) {
  const analysis = analysisFor(episode);
  if (!analysis || !analysis.clean || !analysis.clean.url) return null;
  return analysis.clean;
}

function cleanChapters(clean) {
  if (!Array.isArray(clean.chapters)) return [];
  return clean.chapters
    .filter((c) => c && isFinite(Number(c.start)) && c.title)
    .map((c) => ({ start: Number(c.start), title: String(c.title) }))
    .sort((a, b) => a.start - b.start);
}

// Themen der Folge (leer, wenn es keine Analyse gibt).
function buildChapters(episode) {
  const analysis = analysisFor(episode);
  if (!analysis || !Array.isArray(analysis.chapters)) return [];
  return analysis.chapters
    .filter((c) => c && isFinite(Number(c.start)) && c.title)
    .map((c) => ({ start: Number(c.start), title: String(c.title) }))
    .sort((a, b) => a.start - b.start);
}

/**
 * Passt die Analyse zur Datei, die gerade geladen wurde?
 *
 * Der Anbieter (Podigee) schaltet Werbung dynamisch dazu - dieselbe Adresse
 * liefert mal die Fassung mit Werbung, mal die ohne. Die Marken gelten aber
 * nur für genau die Fassung, die analysiert wurde. Deshalb wird nach dem
 * Laden die Länge verglichen:
 *
 *   passt zur analysierten Länge  -> Marken gelten
 *   passt zur Länge aus dem Feed  -> Fassung OHNE Werbung: nichts
 *                                    überspringen, Themen um die
 *                                    weggefallene Werbezeit nach vorn ziehen
 *   passt zu keiner von beiden    -> keine Marken, feste Werte
 */
function checkAnalysisFitsFile(podcastName, episode) {
  const duration = audioDuration();
  if (!activeAnalysis || !isFinite(duration)) return;

  const analysed = Number(activeAnalysis.durationSeconds) || 0;
  const feed = Number(activeAnalysis.feedDurationSeconds) || 0;

  if (analysed && Math.abs(duration - analysed) <= 5) return; // alles wie erwartet

  // Ohne dynamische Werbung (SRF, DLF) ändert sich die Datei nicht. Eine
  // kleine Abweichung kommt dann nur daher, dass das Handy die Länge einer
  // MP3 anders schätzt als die Analyse - am 6.11. fielen deshalb die
  // Sprungmarken von HeuteMorgen weg. Erst eine grobe Abweichung (eine
  // andere Fassung der Folge) lässt die Marken fallen.
  if (!CONFIG_WERBUNG.has(podcastName) && analysed && Math.abs(duration - analysed) <= Math.max(15, analysed * 0.05)) {
    console.log('Länge weicht leicht ab (' + Math.round(duration) + 's statt ' + Math.round(analysed) + 's) - Marken gelten');
    return;
  }

  if (feed && Math.abs(duration - feed) <= 5) {
    // Fassung ohne Werbung: Die Themen liegen um die Werbezeit früher, die
    // vor ihnen lag.
    const removedBefore = (time) => activeAdRanges
      .filter((r) => r[1] <= time)
      .reduce((sum, r) => sum + (r[1] - r[0]), 0);
    activeChapters = activeChapters
      .map((c) => ({ start: Math.max(0, c.start - removedBefore(c.start)), title: c.title }))
      .sort((a, b) => a.start - b.start);
    activeAdRanges = [];
    console.log('Folge ohne Werbung geliefert (' + Math.round(duration) + 's) - nichts zu überspringen');
    updateTransportUI();
    return;
  }

  console.log('Analyse passt nicht zur Datei (' + Math.round(duration) + 's statt ' +
    Math.round(analysed) + 's) - feste Werte werden benutzt');
  activeChapters = [];
  activeAdRanges = buildAdRangesFromTrim(podcastName);
  updateTransportUI();
}

// Nur die festen Werte aus PODCAST_TRIM, ohne Analyse.
function buildAdRangesFromTrim(podcastName) {
  const trim = getTrim(podcastName);
  if (!trim) return [];
  const ranges = [];
  if (trim.startSeconds) ranges.push([0, trim.startSeconds]);
  if (Array.isArray(trim.adRanges)) trim.adRanges.forEach((r) => ranges.push([r[0], r[1]]));
  if (trim.endSeconds) ranges.push([trim.endSeconds, Number.MAX_SAFE_INTEGER]);
  return ranges.sort((a, b) => a[0] - b[0]);
}

function audioDuration() {
  return audio.duration && isFinite(audio.duration) ? audio.duration : Infinity;
}

// "ab Sekunde" und "Ende bei" aus der Tabelle gelten immer - auch wenn
// eine Analyse oder die geschnittene Datei gespielt wird. Die Werte zählen
// in der Originaldatei; in der geschnittenen Datei liegen sie um die
// herausgeschnittene Werbung davor früher.
let activeTabellenSchnitt = null;  // {startSeconds, endSeconds} oder null

function inGeschnitteneZeit(t) {
  if (!activeClean || !activeAnalysis || !Array.isArray(activeAnalysis.adRanges)) return t;
  let weg = 0;
  activeAnalysis.adRanges.forEach((r) => {
    const von = Number(r[0]), bis = Number(r[1]);
    if (isFinite(von) && isFinite(bis) && von < t) weg += Math.min(bis, t) - von;
  });
  return Math.max(0, t - weg);
}

function schnittBereiche() {
  const t = activeTabellenSchnitt;
  if (!t) return [];
  const bereiche = [];
  if (t.startSeconds > 0) bereiche.push([0, inGeschnitteneZeit(t.startSeconds)]);
  if (t.endSeconds > 0) bereiche.push([inGeschnitteneZeit(t.endSeconds), Number.MAX_SAFE_INTEGER]);
  return bereiche.filter((r) => r[1] > r[0]);
}

// Werbebereiche, auf die tatsächliche Dateilänge begrenzt.
function adRanges() {
  const duration = audioDuration();
  const alle = activeAdRanges.concat(schnittBereiche()).sort((a, b) => a[0] - b[0]);
  if (!isFinite(duration)) return alle;
  return alle
    .map((r) => [Math.max(0, Math.min(r[0], duration)), Math.max(0, Math.min(r[1], duration))])
    .filter((r) => r[1] > r[0]);
}

// Liegt dieser Zeitpunkt in einem Werbeblock? Dann den Bereich liefern.
function adRangeAt(time) {
  const ranges = adRanges();
  for (let i = 0; i < ranges.length; i++) {
    if (time >= ranges[i][0] - 0.05 && time < ranges[i][1]) return ranges[i];
  }
  return null;
}

// Die hörbaren Stücke zwischen den Werbeblöcken.
function playableSegments() {
  const duration = audioDuration();
  if (!isFinite(duration)) return [];
  const segments = [];
  let cursor = 0;
  adRanges().forEach((r) => {
    if (r[0] > cursor) segments.push([cursor, r[0]]);
    cursor = Math.max(cursor, r[1]);
  });
  if (cursor < duration) segments.push([cursor, duration]);
  return segments.filter((seg) => seg[1] - seg[0] > 0.2);
}

function contentStart() {
  const segments = playableSegments();
  return segments.length > 0 ? segments[0][0] : 0;
}

function contentEnd() {
  const segments = playableSegments();
  return segments.length > 0 ? segments[segments.length - 1][1] : audioDuration();
}

// Gesamtlänge ohne Werbung - das ist die Länge, die im Player steht.
function playableLength() {
  return playableSegments().reduce((sum, seg) => sum + (seg[1] - seg[0]), 0);
}

// Echte Position in der Datei -> Position ohne Werbung (für Anzeige/Balken).
function realToPlayable(time) {
  let sum = 0;
  const segments = playableSegments();
  for (let i = 0; i < segments.length; i++) {
    const [from, to] = segments[i];
    if (time < from) return sum;
    if (time <= to) return sum + (time - from);
    sum += to - from;
  }
  return sum;
}

// Umgekehrter Weg: Position ohne Werbung -> echte Position in der Datei.
function playableToReal(position) {
  let remaining = Math.max(0, position);
  const segments = playableSegments();
  for (let i = 0; i < segments.length; i++) {
    const [from, to] = segments[i];
    const length = to - from;
    if (remaining <= length) return from + remaining;
    remaining -= length;
  }
  return segments.length > 0 ? segments[segments.length - 1][1] : 0;
}

// --- Erkannte Werbeblöcke und Themen ------------------------------------
// data/analysis.json wird mehrmals täglich von einer GitHub Action
// geschrieben (siehe tools/analyze.mjs) und liegt auf derselben Adresse wie
// diese Seite. Darin steht pro Folge (Schlüssel = guid), wo die Werbung
// liegt und wie die Themen heissen.
const ANALYSIS_URL = 'data/analysis.json';
let EPISODE_ANALYSIS = {};

async function loadAnalysisFile() {
  try {
    // Zeitstempel in der Adresse: so liefert der Browser-Cache nie einen
    // alten Stand, wenn die Action gerade neu geschrieben hat.
    const res = await fetch(ANALYSIS_URL + '?t=' + Math.floor(Date.now() / 60000), { cache: 'no-store' });
    if (!res.ok) {
      console.error('Analyse-Datei: HTTP ' + res.status);
      return;
    }
    const data = await res.json();
    EPISODE_ANALYSIS = (data && data.episodes) || {};
    console.log('Analyse geladen:', Object.keys(EPISODE_ANALYSIS).length, 'Folgen, Stand', data && data.updatedAt);
  } catch (err) {
    console.error('Analyse-Datei nicht ladbar', err);
  }
}

// Analyse zu einer Folge - ausschliesslich aus data/analysis.json.
//
// Der Apps-Script-Proxy liefert zu manchen Folgen noch eine eigene,
// veraltete Analyse mit (ein früherer Versuch, der im Backend lief). Die
// wird bewusst NICHT mehr benutzt: Zwei Quellen für dieselbe Sache führen
// dazu, dass man bei falschen Zeiten nicht weiss, woher sie stammen.
// Gibt es hier nichts, gelten die festen Werte aus PODCAST_TRIM.
function analysisFor(episode) {
  if (!episode) return null;
  return EPISODE_ANALYSIS[episode.guid] || null;
}

// --- Titel aufräumen ----------------------------------------------------
// Manche Feeds stellen jedem Titel immer denselben Textbaustein voran, der
// in der schmalen Kachel nur Platz kostet. Hier lassen sich solche Muster
// ergänzen: "vorne abschneiden, wenn der Titel so anfängt".
const TITLE_PREFIXES_TO_STRIP = [
  /^die\s+nachrichten\s+vom\s+/i   // DLF: "Die Nachrichten vom 20.10.2026, 14:00 Uhr"
];

function cleanEpisodeTitle(title) {
  if (!title) return title;
  let t = String(title).trim();

  TITLE_PREFIXES_TO_STRIP.forEach((pattern) => {
    if (!pattern.test(t)) return;
    t = t.replace(pattern, '');
    // Das Datum gleich mit wegwerfen - es steht ohnehin in der Datumszeile
    // der Kachel. Übrig bleibt z.B. "14:00 Uhr".
    t = t.replace(/^\d{1,2}\.\d{1,2}\.(\d{2,4})?\s*(um|,|-|–|·)?\s*/i, '').trim();
  });

  if (!t) return 'Nachrichten'; // falls vom Titel nichts übrig bleibt
  return t.charAt(0).toUpperCase() + t.slice(1);
}

// --- Umbenannte Podcasts ------------------------------------------------
// Beim Umbenennen einer Kachel würden Reihenfolge, Hörfortschritt und
// Cover unter dem alten Namen liegenbleiben. Diese Tabelle zieht sie beim
// Start einmalig auf den neuen Namen um.
const RENAMED_PODCASTS = {
  'DLF Nachrichten (lang)': 'DLF Nachrichten'
};

function migrateRenamedPodcasts() {
  const renames = Object.keys(RENAMED_PODCASTS);
  if (renames.length === 0) return;

  [STORAGE_KEY, IMAGE_KEY].forEach((key) => {
    let data;
    try {
      data = JSON.parse(localStorage.getItem(key));
    } catch (e) {
      return;
    }
    if (!data || typeof data !== 'object') return;
    let changed = false;
    renames.forEach((oldName) => {
      const newName = RENAMED_PODCASTS[oldName];
      if (data[oldName] && !data[newName]) {
        data[newName] = data[oldName];
        changed = true;
      }
      if (data[oldName]) {
        delete data[oldName];
        changed = true;
      }
    });
    if (changed) {
      try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
    }
  });

}

// ist die Reihenfolge hier. Früher liess sie sich auch mit einem Ziehgriff

// zwei Stellen für dieselbe Sache widersprechen sich sonst ständig.
function getOrderedPodcasts() {
  return PODCASTS;
}

const STORAGE_KEY = 'podcastPlayerState_v2';
const IMAGE_KEY = 'podcastImages_v1';

// --- Cover-Bilder: pro Podcast EINE feste URL, ein Jahr lang -------------
// Vorher wurde das Bild der jeweiligen Episode benutzt. Da sich diese URL
// mit jeder neuen Folge ändert, musste der Browser jedes Mal ein neues Bild
// herunterladen. Jetzt wird pro Podcast die zuerst gesehene Cover-URL in
// localStorage festgehalten und ein Jahr lang weiterverwendet - dadurch ist
// die URL stabil, der Service-Worker-Cache greift (siehe sw.js) und es
// entsteht im Normalbetrieb überhaupt kein Bild-Download mehr.
const IMAGE_MAX_AGE_MS = 365 * 24 * 3600 * 1000;

function loadImageCache() {
  try {
    return JSON.parse(localStorage.getItem(IMAGE_KEY)) || {};
  } catch (e) {
    return {};
  }
}

function saveImageCache(cache) {
  try {
    localStorage.setItem(IMAGE_KEY, JSON.stringify(cache));
  } catch (e) {
    console.error('Cover-Cache konnte nicht gespeichert werden', e);
  }
}

// Liefert die gemerkte Cover-URL des Podcasts. Ist noch keine gemerkt oder
// ist der Eintrag älter als ein Jahr, wird die aktuelle URL aus dem Feed
// übernommen und neu gemerkt.
function getPodcastImage(podcastName, feedImageUrl) {
  const cache = loadImageCache();
  const entry = cache[podcastName];
  const fresh = entry && entry.url && (Date.now() - (entry.ts || 0)) < IMAGE_MAX_AGE_MS;
  if (fresh) return entry.url;
  if (!feedImageUrl) return entry && entry.url ? entry.url : '';
  cache[podcastName] = { url: feedImageUrl, ts: Date.now() };
  saveImageCache(cache);
  return feedImageUrl;
}

// Setzt das Bild nur, wenn sich die URL wirklich ändert - ein erneutes
// Zuweisen derselben src lässt den Browser sonst kurz neu dekodieren
// (sichtbares Flackern beim Umblättern der Folgen).
function setImageSrc(imgEl, url) {
  if (!imgEl || !url) return;
  if (imgEl.getAttribute('src') !== url) imgEl.src = url;
}

function loadAllState() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) {
    return {};
  }
}

function saveAllState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('localStorage-Fehler', e);
  }
}

function getPodcastState(allState, podcastName) {
  if (!allState[podcastName]) {
    allState[podcastName] = {
      lastSeenGuid: null,
      currentIndex: 0,
      progress: {},   // guid -> Sekunden
      listened: {}    // guid -> true
    };
  }
  return allState[podcastName];
}

const WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

function formatDateNoYear(pubDate) {
  if (!pubDate) return '';
  const d = new Date(pubDate);
  if (isNaN(d)) return pubDate;
  const wd = WEEKDAYS[d.getDay()];
  const day = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const time = d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
  return `${wd}, ${day}.${month}., ${time}`;
}

// Normalisiert die Dauer-Angabe aus dem Feed (kommt uneinheitlich an:
// mal schon als "12:34"/"1:02:03" von itunes:duration, mal als reine
// Sekundenzahl wie "754" bei den DLF-Audiobeiträgen) zu einem
// einheitlichen "M:SS" bzw. "H:MM:SS"-Format fürs Anzeigen.
function formatDuration(duration) {
  if (!duration) return '';
  const trimmed = String(duration).trim();

  // Schon im "M:SS" oder "H:MM:SS"-Format -> unverändert übernehmen
  if (/^\d{1,2}(:\d{2}){1,2}$/.test(trimmed)) {
    return trimmed;
  }

  // Reine Sekundenzahl -> in M:SS bzw. H:MM:SS umrechnen
  const totalSeconds = parseInt(trimmed, 10);
  if (isNaN(totalSeconds) || totalSeconds < 0) return '';

  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;

  if (h > 0) {
    return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }
  return `${m}:${String(s).padStart(2, '0')}`;
}
