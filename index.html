async function loadPodcast(podcast, card) {
  try {
    // Sonderfälle ohne eigenen Feed: Der Proxy stellt die Liste zusammen.
    const url = podcast.type === 'dlf_audio'
      ? PROXY_URL + '?mode=dlfaudio'
      : podcast.type === 'tagesschau_audio'
      ? PROXY_URL + '?mode=tagesschau'
      : PROXY_URL + '?feed=' + encodeURIComponent(podcast.feed) +
        (podcast.minDurationSeconds ? '&minDuration=' + podcast.minDurationSeconds : '') +
        (podcast.titleContains ? '&titleContains=' + encodeURIComponent(podcast.titleContains) : '') +
        (podcast.titleExcludes ? '&titleExcludes=' + encodeURIComponent(podcast.titleExcludes) : '');
    const res = await fetch(url);
    const data = await res.json();

    if (data.error || !data.episodes || data.episodes.length === 0) {
      showCardError(card, podcast, data.error || 'Kein Audio gefunden');
      return;
    }

    card.classList.remove('loading', 'error');
    card.dataset.podcastName = podcast.name;
    data.episodes.forEach((ep) => { ep.title = cleanEpisodeTitle(ep.title); });
    card.episodes = data.episodes; // neueste zuerst, Index 0 = neueste

    const allState = loadAllState();
    const pState = getPodcastState(allState, podcast.name);
    const newestGuid = data.episodes[0].guid;

    // Läuft gerade eine Folge dieser Kachel, darf ein Neuladen die Anzeige
    // nicht wegspringen lassen - dann bleibt der aktuelle Index stehen.
    const isPlayingThisCard = activeEpisode && activeEpisode.podcastName === podcast.name && !audio.paused;

    // Neue Episode seit letztem Besuch? -> immer die neueste zeigen
    if (pState.lastSeenGuid !== newestGuid) {
      pState.lastSeenGuid = newestGuid;
      if (!isPlayingThisCard) pState.currentIndex = 0;
    }
    // Falls gespeicherter Index nicht mehr existiert (Feed kürzer geworden)
    if (pState.currentIndex >= data.episodes.length) {
      pState.currentIndex = 0;
    }
    saveAllState(allState);

    // Läuft eine Folge dieser Kachel, den Index auf genau diese Folge
    // nachziehen (im Feed kann sie durch neue Folgen verschoben sein).
    if (isPlayingThisCard) {
      const playingIdx = data.episodes.findIndex(e => e.guid === activeEpisode.guid);
      if (playingIdx !== -1) pState.currentIndex = playingIdx;
      saveAllState(allState);
    }

    renderCard(card, podcast.name, pState.currentIndex);

    // Klick-Handler nur beim ersten erfolgreichen Laden anhängen, damit
    // ein Neuladen keine doppelten Handler erzeugt.
    if (!card.dataset.wired) {
      card.dataset.wired = '1';
      card.addEventListener('click', () => onCardClick(card));
    }
    updateEpisodeNavButtons();
  } catch (err) {
    showCardError(card, podcast, 'Fehler beim Laden - tippen für neuen Versuch');
    console.error(podcast.name, err);
  }
}

// Fehler auf der Kachel anzeigen. Ein Tipp darauf versucht es erneut -
// vorher musste man dafür die ganze Seite neu laden.
function showCardError(card, podcast, message) {
  card.classList.remove('loading');
  card.classList.add('error');
  card.querySelector('.card-title').textContent = message;
  if (!card.dataset.retryWired) {
    card.dataset.retryWired = '1';
    card.addEventListener('click', () => {
      if (!card.classList.contains('error')) return;
      card.classList.remove('error');
      card.classList.add('loading');
      card.querySelector('.card-title').textContent = 'Wird geladen …';
      loadPodcast(card.podcast || podcast, card);
    });
  }
}

/* ============================================================
   AKTUALISIEREN: alle Feeds neu abfragen, ohne die Seite neu zu
   laden (eine laufende Folge spielt dabei weiter).
   ============================================================ */

let isRefreshing = false;
let zuletztGeladen = Date.now();   // siehe visibilitychange weiter unten

async function refreshAll() {
  if (isRefreshing) return;
  isRefreshing = true;
  zuletztGeladen = Date.now();
  if (refreshBtn) refreshBtn.classList.add('busy');
  try {
    await loadAnalysisFile();
    const cards = Array.from(grid.children).filter((c) => c.podcast);
    await Promise.all(cards.map((card) => loadPodcast(card.podcast, card)));
    zeigeSammlung();
  } finally {
    isRefreshing = false;
    if (refreshBtn) refreshBtn.classList.remove('busy');
  }
}

if (refreshBtn) refreshBtn.addEventListener('click', refreshAll);

// Rendert eine Karte für einen bestimmten Episoden-Index.
// options.noOlder = true -> es gibt keine ältere Episode mehr als die
// gerade zu Ende gehörte; zeigt das statt eines Datums an.
function renderCard(card, podcastName, index, options) {
  options = options || {};
  const episode = card.episodes[index];
  const allState = loadAllState();
  const pState = getPodcastState(allState, podcastName);

  // Die Sammlung hat kein eigenes Bild: Jeder Beitrag bringt seins mit.
  // getPodcastImage merkt sich sonst EIN Bild pro Podcastnamen und wuerde
  // allen Beitraegen das des ersten verpassen.
  setImageSrc(card.querySelector('img'), istSammlung(card)
    ? (episode.imageUrl || '')
    : getPodcastImage(podcastName, episode.imageUrl));

  card.querySelector('.card-title').textContent = episode.title || '(ohne Titel)';

  const dateEl = card.querySelector('.card-date');
  const durationText = formatDuration(episode.duration);
  const durationPrefix = durationText ? `${durationText} · ` : '';

  if (istSammlung(card)) {
    const listenedS = !!pState.listened[episode.guid];
    dateEl.innerHTML = `Beitrag ${index + 1} von ${card.episodes.length} · ` +
      durationPrefix + (episode.podcastName || '') +
      (listenedS ? ' <span class="card-listened">✓ gehört</span>' : '');
    return;
  }

  if (options.noOlder) {
    dateEl.innerHTML = 'Keine ältere Folge geladen <span class="card-listened">✓ gehört</span>';
  } else {
    const listened = !!pState.listened[episode.guid];
    dateEl.innerHTML = durationPrefix + formatDateNoYear(episode.pubDate) +
      (listened ? ' <span class="card-listened">✓ gehört</span>' : '');
  }
}

// Aktualisiert die Player-Leiste (Titel/Bild unten), OHNE etwas abzuspielen.
// Wird benutzt, wenn nach dem natürlichen Ende einer Folge schon die
// nächstältere angezeigt werden soll, bevor sie angeklickt wird.
function updatePlayerPreview(card, podcastName, index) {
  const episode = card.episodes[index];
  // Themen/Werbebereiche gleich auf die angezeigte Folge umstellen, sonst
  // stünde noch das Thema der gerade beendeten Folge in der Leiste.
  activeAdRanges = buildAdRanges(podcastName, episode);
  activeChapters = buildChapters(episode);
  updateChapterUI();
  const coverUrl = getPodcastImage(podcastName, episode.imageUrl);
  setImageSrc(playerImg, coverUrl);
  playerPodcast.textContent = podcastName;
  playerTitle.textContent = (episode.title || '') + '  ·  ' + formatDateNoYear(episode.pubDate);
  setMediaMetadata(podcastName, episode, coverUrl);
}

// Titel/Interpret/Cover für Lockscreen, Kopfhörer und Autoradio.
// Das Cover wird dem Betriebssystem als URL übergeben; ob das Auto es
// anzeigt, hängt vom Bluetooth-Profil des Autoradios ab (Cover-Art gibt es
// erst ab AVRCP 1.6) - Titel und Podcast-Name kommen praktisch überall an.
function setMediaMetadata(podcastName, episode, coverUrl) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: episode.title || podcastName,
    artist: podcastName,
    album: formatDateNoYear(episode.pubDate),
    artwork: coverUrl ? [{ src: coverUrl, sizes: '512x512' }] : []
  });
}

function onCardClick(card) {
  // Ist die Leiste gerade ausgeblendet (weggewischt oder mit × geschlossen)
  // und man tippt die laufende Kachel an, soll NUR die Leiste zurückkommen -
  // sonst würde dieser Tipp wie gewohnt eine Folge weiterblättern.
  if (activeCard === card && isPlayerBarHidden()) {
    showPlayerBar();
    // Mit × geschlossen (= angehalten)? Dann an derselben Stelle weiterspielen.
    if (audio.src && audio.paused && !activeEpisodeEnded) audio.play();
    return;
  }

  const podcastName = card.dataset.podcastName;
  const allState = loadAllState();
  const pState = getPodcastState(allState, podcastName);

  if (activeCard === card && istSammlung(card)) {
    // In der Sammlung bedeutet ein erneuter Tipp nicht "eine Folge
    // weiter" - zum naechsten Beitrag geht es mit dem Skip-Knopf.
    renderCard(card, podcastName, pState.currentIndex);
    playEpisode(card, podcastName, pState.currentIndex);
    return;
  }

  if (activeCard === card) {
    if (activeEpisodeEnded) {
      // Folge ist gerade zu Ende gelaufen und die Anzeige wurde bereits
      // auf die nächstältere Folge vorgerückt -> die jetzt einfach abspielen,
      // nicht nochmal weiterspringen.
    } else {
      // Card ist aktiv, aber Folge läuft noch/ist pausiert -> manuell
      // eine Folge weiter zurückblättern.
      pState.currentIndex = Math.min(pState.currentIndex + 1, card.episodes.length - 1);
      saveAllState(allState);
    }
  }
  // Andere/erste Karte -> aktuellen (ggf. gespeicherten) Index einfach abspielen

  // Sind wir bereits bei der ältesten geladenen Folge UND die wurde schon
  // gehört (egal ob in dieser oder einer früheren Sitzung) -> nicht erneut
  // abspielen, sondern nur den "keine ältere Folge"-Hinweis zeigen. Ohne
  // diese Prüfung würde ein erneuter Klick die letzte Folge endlos
  // wiederholen, sobald man einmal ganz durch ist.
  const currentEpisode = card.episodes[pState.currentIndex];
  const isOldest = pState.currentIndex === card.episodes.length - 1;
  const oldestAlreadyListened = isOldest && !!pState.listened[currentEpisode.guid];

  if (oldestAlreadyListened) {
    renderCard(card, podcastName, pState.currentIndex, { noOlder: true });
    activeCard = card;
    return;
  }

  renderCard(card, podcastName, pState.currentIndex);
  playEpisode(card, podcastName, pState.currentIndex);
  activeCard = card;
}

function playEpisode(card, podcastName, index) {
  sammlungAbbrechen();   // eine neue Wahl beendet das Warten auf den naechsten Beitrag
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  card.classList.add('active');
  activeCard = card; // schon hier setzen - die Aufrufer tun es sonst erst danach,
                     // und die Folgen-Knöpfe unten brauchen die aktive Karte

  const episode = card.episodes[index];
  const allState = loadAllState();
  const pState = getPodcastState(allState, podcastName);

  // In der Sammlung steht in der Leiste, woher der Beitrag stammt - das
  // sagt mehr als das Wort "Sammlung".
  const anzeigeName = istSammlung(card) ? (episode.podcastName || podcastName) : podcastName;
  const coverUrl = istSammlung(card)
    ? (episode.imageUrl || '')
    : getPodcastImage(podcastName, episode.imageUrl);
  setImageSrc(playerImg, coverUrl);
  playerPodcast.textContent = anzeigeName;
  playerTitle.textContent = (episode.title || '') + '  ·  ' + formatDateNoYear(episode.pubDate);

  // Liegt eine werbefrei geschnittene Fassung bereit, wird die gespielt.
  // Dann gibt es nichts zu überspringen und die Themenmarken stimmen
  // sekundengenau - sie wurden an genau dieser Datei gemessen.
  const clean = cleanVersion(episode);
  activeClean = clean;
  audio.src = clean ? clean.url : episode.audioUrl;
  activeEpisode = { podcastName, guid: episode.guid };
  activeEpisodeEnded = false;
  activeAdRanges = clean ? [] : buildAdRanges(podcastName, episode);
  activeChapters = clean ? cleanChapters(clean) : buildChapters(episode);
  activeAnalysis = analysisFor(episode);
  activeTabellenSchnitt = CONFIG_TRIM[podcastName] || null;

  // Fällt die geschnittene Datei aus (gelöscht, noch nicht hochgeladen),
  // wird einmal auf die Originaldatei zurückgeschaltet.
  if (clean) {
    const fallback = () => {
      audio.removeEventListener('error', fallback);
      if (activeClean !== clean) return;
      console.log('Geschnittene Fassung nicht erreichbar - Originaldatei wird benutzt');
      activeClean = null;
      activeAdRanges = buildAdRanges(podcastName, episode);
      activeChapters = buildChapters(episode);
      audio.src = episode.audioUrl;
      audio.load();
      audio.play().catch(() => {});
    };
    audio.addEventListener('error', fallback);
  }

  setMediaMetadata(anzeigeName, episode, coverUrl);

  const savedProgress = pState.progress[episode.guid];
  const resume = () => {
    if (!activeClean) checkAnalysisFitsFile(podcastName, episode);
    // Gespeicherte Position nur übernehmen, wenn sie im hörbaren Bereich
    // liegt und nicht praktisch am Ende - sonst beim Inhalt anfangen.
    const start = contentStart();
    const end = contentEnd();
    const useSaved = savedProgress &&
      savedProgress > start + 5 &&
      savedProgress < end - 15 &&
      !adRangeAt(savedProgress);
    const startAt = useSaved ? savedProgress : start;
    if (startAt > 0) audio.currentTime = startAt;
    audio.removeEventListener('loadedmetadata', resume);
    updateTransportUI();
  };
  audio.addEventListener('loadedmetadata', resume);

  audio.play();
  playerBar.classList.add('visible');
  showPlayerBar(); // beim Starten einer Folge immer zeigen
  syncMainPadding();
  updateEpisodeNavButtons();
  updateTransportUI();
}

// Speichert nur die Wiedergabeposition (und markiert bei Bedarf als
// gehört). Rendert bewusst NICHTS - das übernimmt ausschliesslich der
// 'ended'-Handler, damit es nicht zu widersprüchlichen Neu-Renderings
// zwischen 'pause' (das vor 'ended' feuert) und 'ended' kommt.
function persistProgress() {
  if (!activeEpisode || !audio.duration) return;
  const allState = loadAllState();
  const pState = getPodcastState(allState, activeEpisode.podcastName);
  pState.progress[activeEpisode.guid] = audio.currentTime;

  // "Gehört" bezieht sich auf den hörbaren Teil ohne Werbung - sonst würde
  // eine Folge mit Werbung am Schluss nie 95% erreichen.
  const total = playableLength();
  if (total > 0 && realToPlayable(audio.currentTime) / total > 0.95) {
    pState.listened[activeEpisode.guid] = true;
  }
  saveAllState(allState);
}

audio.addEventListener('timeupdate', () => {
  if (activeEpisode && !activeEpisodeEnded) {
    // Mitten in einem Werbeblock gelandet (am Anfang, zwischendrin oder am
    // Schluss)? Dann sofort ans Ende dieses Blocks springen.
    const ad = adRangeAt(audio.currentTime);
    if (ad) {
      if (ad[1] >= contentEnd() - 0.2) {
        // Nach diesem Block kommt nur noch Werbung -> Folge ist zu Ende.
        audio.pause();
        persistProgress();
        handleEpisodeEnd();
        return;
      }
      audio.currentTime = ad[1] + 0.05;
      updateTransportUI();
      return;
    }

    if (audio.currentTime >= contentEnd() - 0.05) {
      audio.pause();
      persistProgress();
      handleEpisodeEnd();
      return;
    }
  }
  updateTransportUI();
  // Die Nummer wird beim Feuern zurückgesetzt. Browser vergeben Timer-
  // Nummern wieder, sobald ein Timer durch ist: Stünde hier weiter eine
  // alte Nummer, würde der nächste clearTimeout einen FREMDEN Timer
  // abräumen, der sie inzwischen bekommen hat.
  clearTimeout(saveProgressTimer);
  saveProgressTimer = setTimeout(() => {
    saveProgressTimer = null;
    persistProgress();
  }, 3000);
});
audio.addEventListener('pause', persistProgress);
audio.addEventListener('loadedmetadata', updateTransportUI);
audio.addEventListener('durationchange', updateTransportUI);

/* ============================================================
   EIGENER TRANSPORT: grosser Play/Pause-Knopf, Fortschrittsbalken
   mit Zeitangaben und Folgen-Navigation.
   Alle Zeiten beziehen sich auf den getrimmten Bereich (siehe
   PODCAST_TRIM): abgeschnittene Werbung zählt weder im Balken
   noch in der Restzeit mit.
   ============================================================ */

const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';

let isSeeking = false;

function formatSeconds(totalSeconds) {
  if (!isFinite(totalSeconds) || totalSeconds < 0) totalSeconds = 0;
  const t = Math.floor(totalSeconds);
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const sec = t % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  return `${m}:${String(sec).padStart(2, '0')}`;
}

// Fortschrittsbalken und Zeiten rechnen in "Hörzeit ohne Werbung".
function playableWindow() {
  return { start: contentStart(), end: contentEnd(), length: playableLength() };
}

function updatePlayPauseIcon() {
  if (!playPauseBtn) return;
  const paused = audio.paused;
  playPauseBtn.innerHTML = paused ? ICON_PLAY : ICON_PAUSE;
  playPauseBtn.setAttribute('aria-label', paused ? 'Abspielen' : 'Pause');
}

function updateTransportUI() {
  updatePlayPauseIcon();
  if (!seekEl) return;
  const win = playableWindow();

  if (win.length <= 0) {
    if (!isSeeking) seekEl.value = '0';
    timeCurrentEl.textContent = '0:00';
    timeRemainingEl.textContent = '-0:00';
    return;
  }

  const pos = Math.min(Math.max(realToPlayable(audio.currentTime), 0), win.length);
  if (!isSeeking) seekEl.value = String(Math.round((pos / win.length) * 1000));
  timeCurrentEl.textContent = formatSeconds(pos);
  timeRemainingEl.textContent = '-' + formatSeconds(win.length - pos);

  // Position auch ans Betriebssystem melden - Lockscreen und viele
  // Autoradios zeigen damit einen korrekten Fortschritt an.
  updateChapterUI();

  if ('mediaSession' in navigator && navigator.mediaSession.setPositionState) {
    try {
      navigator.mediaSession.setPositionState({
        duration: win.length,
        position: pos,
        playbackRate: audio.playbackRate || 1
      });
    } catch (e) { /* ungültige Werte (z.B. während des Ladens) ignorieren */ }
  }
}

function togglePlayPause() {
  if (!audio.src) return;
  if (audio.paused) {
    // Am Ende des Inhalts erneut auf Play: wieder vorne anfangen statt
    // sofort wieder zu stoppen.
    if (playableLength() > 0 && audio.currentTime >= contentEnd() - 0.5) {
      audio.currentTime = contentStart();
      activeEpisodeEnded = false;
    }
    audio.play();
  } else {
    audio.pause();
  }
}

if (playPauseBtn) playPauseBtn.addEventListener('click', togglePlayPause);

if (seekEl) {
  seekEl.addEventListener('pointerdown', () => { isSeeking = true; });
  seekEl.addEventListener('input', () => {
    isSeeking = true;
    const win = playableWindow();
    if (win.length <= 0) return;
    const pos = (Number(seekEl.value) / 1000) * win.length;
    timeCurrentEl.textContent = formatSeconds(pos);
    timeRemainingEl.textContent = '-' + formatSeconds(win.length - pos);
  });
  seekEl.addEventListener('change', () => {
    const win = playableWindow();
    if (win.length > 0) {
      // Der Balken kennt nur Hörzeit ohne Werbung - zurückrechnen.
      audio.currentTime = playableToReal((Number(seekEl.value) / 1000) * win.length);
      activeEpisodeEnded = false;
    }
    isSeeking = false;
    updateTransportUI();
  });
}

/* ------------------------------------------------------------------
   THEMEN (KAPITEL)
   Das Backend gliedert die Folge in Themen. Angezeigt werden bewusst
   nur zwei: das laufende und das nächste. "Thema ⏭" springt zum
   Anfang des nächsten Themas; liegt dazwischen Werbung, überspringt
   der Player sie wie gewohnt automatisch.
   ------------------------------------------------------------------ */

// Index des Themas, das gerade läuft (-1, wenn es keine Themen gibt).
function currentChapterIndex() {
  if (activeChapters.length === 0) return -1;
  let idx = 0;
  for (let i = 0; i < activeChapters.length; i++) {
    if (audio.currentTime + 0.25 >= activeChapters[i].start) idx = i;
  }
  return idx;
}

// Die Einträge der Themenliste: in der Sammlung die Beiträge, sonst die
// Themen der Folge. Liefert auch, welcher gerade läuft.
function themenEintraege() {
  if (istSammlung(activeCard) && activeCard.episodes && activeCard.episodes.length > 0) {
    const idx = getPodcastState(loadAllState(), SAMMLUNG_NAME).currentIndex;
    return {
      schluessel: 'S|' + activeCard.episodes.map((e) => e.guid).join('|'),
      jetzt: idx,
      eintraege: activeCard.episodes.map((e) => ({
        zeit: formatDuration(e.duration),
        titel: e.title || '(ohne Titel)'
      }))
    };
  }
  if (activeChapters.length === 0) return null;
  return {
    schluessel: 'T|' + (activeEpisode ? activeEpisode.guid : '') + '|' +
      activeChapters.map((c) => Math.round(c.start) + c.title).join('|'),
    jetzt: currentChapterIndex(),
    eintraege: activeChapters.map((c) => ({
      zeit: formatSeconds(realToPlayable(c.start)),
      titel: c.title
    }))
  };
}

let themenSchluessel = '';   // welche Liste gerade gezeichnet ist
let themenJetzt = -1;        // welche Zeile hervorgehoben ist

function updateChapterUI() {
  if (!chapterRow || !chapterListEl) return;
  const liste = themenEintraege();

  if (!liste) {
    themenSchluessel = '';
    themenJetzt = -1;
    chapterListEl.textContent = '';
    if (!chapterRow.hasAttribute('hidden')) {
      chapterRow.setAttribute('hidden', '');
      syncMainPadding();
    }
    return;
  }

  // Die Liste wird nur neu gezeichnet, wenn sich ihr Inhalt ändert - diese
  // Funktion läuft bei jedem Zeit-Update mehrmals pro Sekunde.
  if (liste.schluessel !== themenSchluessel) {
    themenSchluessel = liste.schluessel;
    themenJetzt = -1;
    chapterListEl.textContent = '';
    liste.eintraege.forEach((e, i) => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.index = String(i);
      const zeit = document.createElement('span');
      zeit.className = 'zeit';
      zeit.textContent = e.zeit;
      const titel = document.createElement('span');
      titel.className = 'titel';
      titel.textContent = e.titel;
      btn.append(zeit, titel);
      li.appendChild(btn);
      chapterListEl.appendChild(li);
    });
  }

  if (liste.jetzt !== themenJetzt) {
    themenJetzt = liste.jetzt;
    Array.from(chapterListEl.children).forEach((li, i) => li.classList.toggle('jetzt', i === themenJetzt));
    // Das laufende Thema oben in der Liste zeigen, das davor noch
    // angeschnitten. Nur die Liste scrollt, nie die Seite.
    const li = chapterListEl.children[themenJetzt];
    if (li) chapterListEl.scrollTop = Math.max(0, li.offsetTop - 12);
  }

  if (skipChapterBtn) skipChapterBtn.disabled = false;
  if (chapterRow.hasAttribute('hidden')) {
    chapterRow.removeAttribute('hidden');
    syncMainPadding();
    // Erst jetzt hat die Liste eine Höhe; die Scrollposition nachziehen.
    const li = chapterListEl.children[themenJetzt];
    if (li) chapterListEl.scrollTop = Math.max(0, li.offsetTop - 12);
  }
}

// Tipp auf eine Zeile: dorthin springen.
if (chapterListEl) {
  chapterListEl.addEventListener('click', (ev) => {
    const btn = ev.target.closest('button[data-index]');
    if (!btn) return;
    const i = Number(btn.dataset.index);
    if (istSammlung(activeCard)) {
      sammlungAbbrechen();
      spieleSammlung(i);
      return;
    }
    const c = activeChapters[i];
    if (!c) return;
    audio.currentTime = c.start;
    activeEpisodeEnded = false;
    if (audio.paused) audio.play();
    updateTransportUI();
  });
}

// Zum nächsten Thema springen. Gibt es keines mehr, ans Ende des Inhalts
// springen - dann greift die normale "Folge zu Ende"-Behandlung.
function skipToNextChapter() {
  // In der Sammlung heisst "weiter" nicht naechstes Thema, sondern
  // naechster Beitrag.
  if (istSammlung(activeCard)) {
    sammlungSpringe(1);
    return;
  }
  if (activeChapters.length === 0) return;
  const idx = currentChapterIndex();
  const next = activeChapters[idx + 1];

  if (next) {
    audio.currentTime = next.start;
    activeEpisodeEnded = false;
    if (audio.paused) audio.play();
    updateTransportUI();
    return;
  }

  audio.pause();
  persistProgress();
  handleEpisodeEnd();
}

if (skipChapterBtn) skipChapterBtn.addEventListener('click', skipToNextChapter);

// --- Folgen-Navigation ---------------------------------------------------
// delta = +1 -> eine Folge älter, -1 -> eine Folge neuer.
function goToEpisode(delta) {
  if (!activeCard || !activeEpisode || !activeCard.episodes) return;
  const idx = activeCard.episodes.findIndex(e => e.guid === activeEpisode.guid);
  if (idx === -1) return;
  const target = idx + delta;
  if (target < 0 || target >= activeCard.episodes.length) return;

  const podcastName = activeEpisode.podcastName;
  const allState = loadAllState();
  const pState = getPodcastState(allState, podcastName);
  pState.currentIndex = target;
  saveAllState(allState);
  renderCard(activeCard, podcastName, target);
  playEpisode(activeCard, podcastName, target);
}

function updateEpisodeNavButtons() {
  if (!prevEpisodeBtn || !nextEpisodeBtn) return;
  let idx = -1;
  let total = 0;
  if (activeCard && activeEpisode && activeCard.episodes) {
    idx = activeCard.episodes.findIndex(e => e.guid === activeEpisode.guid);
    total = activeCard.episodes.length;
  }
  prevEpisodeBtn.disabled = idx === -1 || idx + 1 >= total;
  nextEpisodeBtn.disabled = idx <= 0;
}

if (prevEpisodeBtn) prevEpisodeBtn.addEventListener('click', () => goToEpisode(1));
if (nextEpisodeBtn) nextEpisodeBtn.addEventListener('click', () => goToEpisode(-1));

/* ============================================================
   SAMMLUNG: die Tagesliste
   ------------------------------------------------------------
   Eine Kachel, die sich wie ein Podcast verhält, deren "Folgen"
   aber aus mehreren Feeds stammen: ALLE neuen Beiträge der
   Podcasts, die in der Tabelle in der Spalte "Sammlung" auf ja
   stehen. Eine Längengrenze gibt es hier nicht - was kurz genug
   ist, entscheidet die Auswahl der Podcasts in der Tabelle.

   Warum die Liste hier entsteht und nicht im Lauf auf GitHub:
   DLF Audiobeiträge hat keinen gewöhnlichen Feed, sondern wird
   vom Apps-Script-Proxy zusammengestellt (type dlf_audio). Der
   Lauf käme da nicht heran - und genau dieser Podcast liefert
   die meisten kurzen Beiträge.

   Eine Liste je Tag. Um 7:00 und um 15:00 wird sie ERGÄNZT: Was
   seitdem erschienen ist, kommt ans Ende, und die gemerkte
   Stelle bleibt. Ungehörtes verschwindet also nicht mittags.
   Erst am nächsten Morgen beginnt eine neue Liste, die alte ist
   dann weg. Was einmal in einer Liste stand, kommt nicht wieder.

   Angestossen wird das beim Öffnen der App (oder beim
   Aktualisieren), sobald ein neuer Abschnitt begonnen hat;
   dazwischen bleibt die Liste unverändert.
   ============================================================ */

const SAMMLUNG_NAME = 'Sammlung';
// v2: Die erste Fassung hat Beiträge verworfen und die Liste mittags
// ersetzt. Das Gedächtnis aus dieser Zeit ist unbrauchbar - mit neuem
// Schlüssel beginnt es sauber.
const SAMMLUNG_KEY = 'podcastSammlung_v2';
const SAMMLUNG_PAUSE_MS = 2000;          // Pause zwischen zwei Beiträgen
const SAMMLUNG_GEDAECHTNIS_TAGE = 14;    // so lange gilt "war schon mal drin"

let sammlungCard = null;

// Die Pause zwischen zwei Beiträgen wird NICHT über die Timer-Nummer
// abgebrochen, sondern über diesen Zähler. Grund: Browser vergeben Timer-
// Nummern wieder, sobald ein Timer durch ist. Ein clearTimeout mit einer
// alten Nummer trifft dann einen fremden Timer - genau das hat die Pause
// hier zweimal still verschluckt. Jede Pause bekommt stattdessen eine
// Marke; wer dazwischenfunkt, erhöht den Zähler, und die alte Pause
// erkennt beim Feuern, dass sie nicht mehr gemeint ist.
let sammlungMarke = 0;

function sammlungAbbrechen() {
  sammlungMarke++;
}

function istSammlung(card) {
  return !!(card && card.istSammlung);
}

/**
 * Der laufende Zeitabschnitt: "A" von 7:00 bis 15:00, "B" ab 15:00 bis zum
 * nächsten Morgen um 7:00. Der TAG wechselt um 7:00, nicht um Mitternacht:
 * Um 6:30 gilt noch die Liste von gestern, sonst stünde man früh vor einer
 * leeren Liste, die erst um 7:00 neu entsteht.
 *
 * `seit` ist der früheste Zeitpunkt, ab dem ein Beitrag in die Liste darf:
 * gestern 15:00. So kommt auch der Kommentar vom Vorabend mit, und morgens
 * um 5 Uhr erschienene Beiträge fehlen abends nicht.
 */
function sammlungSlot(jetzt) {
  const d = jetzt || new Date();
  const stunde = d.getHours();
  const tag = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if (stunde < 7) tag.setDate(tag.getDate() - 1);
  const kennung = stunde >= 7 && stunde < 15 ? 'A' : 'B';
  // Als Datum gebaut statt "minus 16 Stunden": So stimmt es auch an den
  // Tagen der Zeitumstellung.
  const seit = new Date(tag.getFullYear(), tag.getMonth(), tag.getDate() - 1, 15, 0, 0);
  const datum = tagesText(tag);
  return { id: datum + '-' + kennung, tag: datum, seit };
}

function ladeSammlung() {
  try { localStorage.removeItem('podcastSammlung_v1'); } catch (e) {}   // Reste der ersten Fassung
  try {
    const roh = JSON.parse(localStorage.getItem(SAMMLUNG_KEY));
    if (roh && typeof roh === 'object') {
      return {
        slot: roh.slot || null,
        tag: roh.tag || null,
        items: Array.isArray(roh.items) ? roh.items : [],
        gesehen: roh.gesehen && typeof roh.gesehen === 'object' ? roh.gesehen : {}
      };
    }
  } catch (e) { /* kaputter oder leerer Speicher: von vorn */ }
  return { slot: null, tag: null, items: [], gesehen: {} };
}

function speichereSammlung(daten) {
  try { localStorage.setItem(SAMMLUNG_KEY, JSON.stringify(daten)); } catch (e) {}
}

function tagesText(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

/**
 * Ergänzt die Liste des Tages um alles, was neu ist - oder beginnt am
 * ersten Abschnitt eines neuen Tages eine neue.
 *
 * Neu ist, was im Zeitfenster liegt (siehe sammlungSlot) und noch in keiner
 * Liste stand. Die Kennungen wandern sofort ins Gedächtnis: Sonst stünde
 * ein Beitrag, der noch im Feed hängt, am nächsten Tag erneut da.
 *
 * Die Dauer spielt hier keine Rolle und wird nicht gelesen. (Sie steht je
 * nach Feed als "283", "4:43" oder "00:02:49" da; die erste Fassung hat das
 * als Zahl gelesen und damit jeden Beitrag aus normalen Feeds verworfen.)
 *
 * Fehlt ein Feed noch (nicht geladen oder ausgefallen), wird der Abschnitt
 * NICHT als erledigt vermerkt. Beim nächsten Aufruf wird nachgeholt, was
 * fehlt; durch das Gedächtnis kommt nichts doppelt.
 */
function baueSammlung(jetzt) {
  const slot = sammlungSlot(jetzt);
  const daten = ladeSammlung();
  if (daten.slot === slot.id) return daten;

  const neuerTag = daten.tag !== slot.tag;
  const liste = neuerTag ? [] : daten.items.slice();
  const altLaenge = liste.length;

  const heute = tagesText(jetzt || new Date());
  const gesehen = Object.assign({}, daten.gesehen);
  const neu = [];
  let alleDa = true;

  Array.from(grid.children).forEach((card) => {
    if (!card.podcast || !card.podcast.sammlung) return;
    if (!card.episodes) { alleDa = false; return; }
    card.episodes.forEach((ep) => {
      if (gesehen[ep.guid]) return;
      const zeit = ep.pubDate ? new Date(ep.pubDate) : null;
      if (!zeit || isNaN(zeit.getTime()) || zeit < slot.seit) return;
      gesehen[ep.guid] = heute;      // sofort, damit derselbe Beitrag aus zwei Kacheln nicht doppelt kommt
      const kopie = Object.assign({}, ep);
      kopie.podcastName = card.podcast.name;
      neu.push(kopie);
    });
  });

  // Älteste zuerst: So liest sich die Liste wie der Tag verlief, und was
  // später dazukommt, hängt hinten an, ohne die Reihenfolge zu stören.
  neu.sort((a, b) => new Date(a.pubDate) - new Date(b.pubDate));
  liste.push(...neu);

  const grenze = new Date(jetzt || Date.now());
  grenze.setDate(grenze.getDate() - SAMMLUNG_GEDAECHTNIS_TAGE);
  const grenzText = tagesText(grenze);
  Object.keys(gesehen).forEach((guid) => {
    if (String(gesehen[guid]) < grenzText) delete gesehen[guid];
  });

  const ergebnis = { slot: alleDa ? slot.id : daten.slot, tag: slot.tag, items: liste, gesehen };
  speichereSammlung(ergebnis);

  const allState = loadAllState();
  const pState = getPodcastState(allState, SAMMLUNG_NAME);
  if (neuerTag) {
    // Neuer Tag: von vorn. Gehört-Haken und Positionen der alten Liste
    // brauchen wir nicht mehr, sonst wächst der Speicher von Tag zu Tag.
    pState.currentIndex = 0;
    pState.listened = {};
    pState.progress = {};
  } else if (neu.length > 0 && altLaenge > 0) {
    // War die Liste bis zum Ende gehört, geht es beim ersten neuen Beitrag
    // weiter - sonst läge man vor dem letzten, schon gehörten.
    const aktuell = liste[pState.currentIndex];
    if (pState.currentIndex === altLaenge - 1 && aktuell && pState.listened[aktuell.guid]) {
      pState.currentIndex = altLaenge;
    }
  }
  saveAllState(allState);
  return ergebnis;
}

// Legt die Kachel an (einmalig) und füllt sie mit der aktuellen Liste.
function zeigeSammlung() {
  const daten = baueSammlung();

  if (!sammlungCard) {
    sammlungCard = createCard({ id: 'sammlung', name: SAMMLUNG_NAME });
    sammlungCard.istSammlung = true;
    sammlungCard.podcast = null;   // kein Feed: weder neu laden noch als Quelle zählen
    sammlungCard.dataset.podcastName = SAMMLUNG_NAME;
    sammlungCard.addEventListener('click', () => onCardClick(sammlungCard));
  }

  sammlungCard.episodes = daten.items;
  sammlungCard.classList.remove('loading', 'error');

  if (daten.items.length === 0) {
    sammlungCard.querySelector('.card-title').textContent = 'Keine neuen Beiträge';
    const stundeJetzt = new Date().getHours();
    sammlungCard.querySelector('.card-date').textContent = 'Nächste Ergänzung um ' +
      (stundeJetzt >= 7 && stundeJetzt < 15 ? '15:00' : '7:00');
    // Ein leeres src zeigt das Symbol für ein kaputtes Bild - deshalb das
    // Icon der App als Platzhalter.
    setImageSrc(sammlungCard.querySelector('img'), 'icon-192.png');
    return;
  }

  const allState = loadAllState();
  const pState = getPodcastState(allState, SAMMLUNG_NAME);
  if (pState.currentIndex >= daten.items.length) {
    pState.currentIndex = 0;
    saveAllState(allState);
  }
  renderCard(sammlungCard, SAMMLUNG_NAME, pState.currentIndex);
}

// Spielt den Beitrag an dieser Stelle der Liste.
function spieleSammlung(index) {
  if (!sammlungCard || !sammlungCard.episodes || index < 0 || index >= sammlungCard.episodes.length) return;
  const allState = loadAllState();
  const pState = getPodcastState(allState, SAMMLUNG_NAME);
  pState.currentIndex = index;
  saveAllState(allState);
  renderCard(sammlungCard, SAMMLUNG_NAME, index);
  playEpisode(sammlungCard, SAMMLUNG_NAME, index);
}

/**
 * Einen Beitrag weiter oder zurück. Das ist der "Skip" beim Hören der
 * Sammlung: ein Thema, das nicht interessiert, fällt damit weg - über den
 * Knopf in der Leiste und über die Vor-/Zurück-Taste am Bluetooth-Gerät.
 */
function sammlungSpringe(richtung) {
  if (!istSammlung(activeCard) || !activeCard.episodes) return;
  sammlungAbbrechen();
  const allState = loadAllState();
  const pState = getPodcastState(allState, SAMMLUNG_NAME);
  const ziel = pState.currentIndex + richtung;
  if (ziel < 0) return;
  if (ziel >= activeCard.episodes.length) {
    // Ende der Liste: anhalten statt von vorn beginnen.
    audio.pause();
    persistProgress();
    return;
  }
  spieleSammlung(ziel);
}

// Wird sowohl vom echten 'ended'-Event aufgerufen als auch dann, wenn ein
// konfiguriertes Trim-Ende (Werbung am Schluss) erreicht ist.
function handleEpisodeEnd() {
  if (!activeEpisode || !activeCard) return;
  activeEpisodeEnded = true;

  const podcastName = activeEpisode.podcastName;
  const allState = loadAllState();
  const pState = getPodcastState(allState, podcastName);
  pState.listened[activeEpisode.guid] = true;

  // Sammlung: zwei Sekunden Luft, dann laeuft der naechste Beitrag von
  // selbst. Am Ende der Liste ist Schluss, es faengt nichts von vorn an.
  if (istSammlung(activeCard)) {
    const karte = activeCard;
    const naechster = pState.currentIndex + 1;
    saveAllState(allState);
    if (naechster < karte.episodes.length) {
      renderCard(karte, podcastName, pState.currentIndex);
      const marke = ++sammlungMarke;
      setTimeout(() => {
        if (marke !== sammlungMarke) return;   // inzwischen wurde etwas anderes gewählt
        if (istSammlung(activeCard)) spieleSammlung(naechster);
      }, SAMMLUNG_PAUSE_MS);
    } else {
      renderCard(karte, podcastName, pState.currentIndex);
      updateChapterUI();
    }
    updateEpisodeNavButtons();
    updateTransportUI();
    return;
  }

  const finishedIndex = activeCard.episodes.findIndex(e => e.guid === activeEpisode.guid);
  const nextIndex = finishedIndex + 1; // eine Folge älter
  const hasOlder = finishedIndex !== -1 && nextIndex < activeCard.episodes.length;

  if (hasOlder) {
    pState.currentIndex = nextIndex;
    saveAllState(allState);
    renderCard(activeCard, podcastName, nextIndex);
    updatePlayerPreview(activeCard, podcastName, nextIndex);
  } else {
    // Keine ältere Folge mehr geladen -> das auf der Karte anzeigen,
    // bis neue Folgen nachkommen.
    if (finishedIndex !== -1) pState.currentIndex = finishedIndex;
    saveAllState(allState);
    renderCard(activeCard, podcastName, finishedIndex !== -1 ? finishedIndex : pState.currentIndex, { noOlder: true });
  }

  updateEpisodeNavButtons();
  updateTransportUI();
}

audio.addEventListener('ended', handleEpisodeEnd);

window.addEventListener('beforeunload', persistProgress);

function skip(seconds) {
  if (!audio.src) return;
  // In Hörzeit springen, damit übersprungene Werbung nicht mitzählt und
  // man nicht in einem Werbeblock landet.
  const total = playableLength();
  if (total <= 0) {
    audio.currentTime = Math.max(0, audio.currentTime + seconds);
    return;
  }
  const target = Math.max(0, Math.min(total - 0.5, realToPlayable(audio.currentTime) + seconds));
  audio.currentTime = playableToReal(target);
}

document.getElementById('back10').addEventListener('click', () => skip(-10));
document.getElementById('back5').addEventListener('click', () => skip(-5));
document.getElementById('fwd5').addEventListener('click', () => skip(5));
document.getElementById('fwd10').addEventListener('click', () => skip(10));
document.getElementById('fwd30').addEventListener('click', () => skip(30));

/* ============================================================
   MEDIA SESSION - externe Buttons (Lockscreen, Kopfhörer, Auto)
   Play/Pause steuert die Wiedergabe, seekbackward/-forward sind
   fest auf -5s / +10s gelegt (wie gewünscht, unabhängig davon,
   was das Betriebssystem als Standardsprung vorschlägt).
   previoustrack/nexttrack springen zur älteren/neueren Folge.
   ============================================================ */

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('seekbackward', () => skip(-5));
  navigator.mediaSession.setActionHandler('seekforward', () => skip(10));

  // In der Sammlung schalten die Vor-/Zurück-Tasten (Kopfhörer, Autoradio)
  // zwischen den Beiträgen - genau dafür sind sie da. Sonst bleiben sie
  // beim Blättern durch die Folgen eines Podcasts.
  navigator.mediaSession.setActionHandler('previoustrack', () => {
    if (istSammlung(activeCard)) sammlungSpringe(-1); else goToEpisode(1);   // älter
  });
  navigator.mediaSession.setActionHandler('nexttrack', () => {
    if (istSammlung(activeCard)) sammlungSpringe(1); else goToEpisode(-1);   // neuer
  });

  // Scrubben vom Lockscreen/Autoradio aus - die Position kommt relativ zum
  // hörbaren Bereich (ohne Werbung), muss also umgerechnet werden.
  if ('setActionHandler' in navigator.mediaSession) {
    try {
      navigator.mediaSession.setActionHandler('seekto', (details) => {
        if (typeof details.seekTime !== 'number') return;
        audio.currentTime = playableToReal(details.seekTime);
        activeEpisodeEnded = false;
        updateTransportUI();
      });
    } catch (e) { /* vom Browser nicht unterstützt */ }
  }
}

audio.addEventListener('play', () => {
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
  updatePlayPauseIcon();
});
audio.addEventListener('pause', () => {
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  updatePlayPauseIcon();
});

/* ============================================================
   WAKE LOCK - Bildschirm soll nicht einschlafen, solange die
   Seite sichtbar/aktiv ist (z.B. Handy im Autohalter).
   ============================================================ */

let wakeLock = null;

async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
  } catch (err) {
    console.error('Wake Lock nicht verfügbar:', err);
  }
}

// Zurück in der App: neu laden, wenn der letzte Stand älter als fünf
// Minuten ist. Die Analyse einer Morgensendung kommt oft erst, nachdem die
// App schon geöffnet war - ohne das bliebe sie bis zum Tippen auf
// "Aktualisieren" ohne Schnitt und Sprungmarken.
const NEU_LADEN_NACH_MS = 5 * 60 * 1000;

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  requestWakeLock();
  if (Date.now() - zuletztGeladen > NEU_LADEN_NACH_MS) refreshAll();
});
requestWakeLock();

/* ============================================================
   PLAYER-LEISTE: dynamisches Bottom-Padding
   Die Höhe der fixierten Player-Leiste kann je nach Gerät/Font-
   Skalierung variieren. Statt eines festen Paddings wird die
   tatsächliche Höhe laufend gemessen (ResizeObserver) und als
   Bottom-Padding auf <main> übertragen, damit die letzte Karte nie
   verdeckt wird.
   ============================================================ */

function syncMainPadding() {
  // Solange noch nichts abgespielt wurde, ist die Leiste unsichtbar - dann
  // braucht es auch keinen Platz dafür.
  const reserved = playerBar.classList.contains('visible') ? playerBar.offsetHeight + 24 : 24;
  mainEl.style.paddingBottom = reserved + 'px';
}

if ('ResizeObserver' in window) {
  new ResizeObserver(syncMainPadding).observe(playerBar);
} else {
  window.addEventListener('resize', syncMainPadding);
}
syncMainPadding();

/* ============================================================
   PLAYER-LEISTE AUSBLENDEN
   Wischt man nach oben (um einen anderen Podcast auszusuchen),
   fährt die Leiste nach unten weg und gibt die Kacheln frei.
   Sie kommt NICHT von selbst zurück - weder beim Weiterscrollen
   noch beim Runterwischen. Zurück kommt sie nur durch einen Tipp
   auf eine Kachel: auf die laufende (holt nur die Leiste zurück)
   oder auf eine andere (startet diesen Podcast).
   Dasselbe macht der Schliessen-Knopf (×) in der Leiste; die
   Wiedergabe läuft in beiden Fällen weiter.
   ============================================================ */

const SCROLL_HIDE_THRESHOLD_PX = 12; // Zittern beim Halten ignorieren
let lastScrollY = window.scrollY;

function hidePlayerBar() {
  playerBar.classList.add('scrolled-away');
}

function showPlayerBar() {
  playerBar.classList.remove('scrolled-away');
  lastScrollY = Math.max(0, window.scrollY); // sonst gilt der alte Stand als "nach oben"
}

function isPlayerBarHidden() {
  return playerBar.classList.contains('scrolled-away');
}

window.addEventListener('scroll', () => {
  const y = Math.max(0, window.scrollY);
  const delta = y - lastScrollY;
  if (Math.abs(delta) < SCROLL_HIDE_THRESHOLD_PX) return;
  lastScrollY = y;
  if (delta < 0) hidePlayerBar(); // Wischen nach oben -> Leiste weg
}, { passive: true });

const playerCloseBtn = document.getElementById('player-close');
if (playerCloseBtn) {
  playerCloseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    audio.pause();   // Schliessen heisst anhalten
    persistProgress(); // Position merken, damit es später weitergeht
    hidePlayerBar();
  });
}

/* ============================================================
   PWA: Service Worker registrieren (für "Zum Startbildschirm
   hinzufügen" unter Chrome/Android)
   ============================================================ */

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.error('Service Worker Registrierung fehlgeschlagen:', err);
    });
  });
}

/* Init */
async function init() {
  migrateRenamedPodcasts();
  removeOldOrderKeys();
  renderTodayHeader();
  updatePlayPauseIcon();
  updateEpisodeNavButtons();

  // Beide Dateien sind klein und kommen von derselben Adresse. Erst die
  // Konfiguration (sie bestimmt, welche Podcasts es überhaupt gibt), dann
  // die Analyse, damit schon die erste angetippte Folge ohne Werbung startet.
  await loadConfigFile();
  await loadAnalysisFile();

  // Die Sammlung braucht alle Feeds, also erst laden, dann bauen. Die
  // Kacheln erscheinen trotzdem einzeln, sobald ihr Feed da ist.
  await Promise.all(getOrderedPodcasts().map((podcast) => {
    const card = createCard(podcast);
    return loadPodcast(podcast, card);
  }));
  zeigeSammlung();
}

init();
</script>
