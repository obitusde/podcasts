<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcasts – Neueste Folgen</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101214">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0d0f11;          /* Seitenhintergrund, dunkelster Ton */
    --bg-elevated: #2d343c; /* Kacheln - deutlich heller als die Seite */
    --border: #434b54;
    --text: #ffffff;        /* reines Weiss für maximalen Kontrast */
    --text-dim: #c3cad2;    /* Nebentext: hell genug, um gut lesbar zu sein */
    --accent: #ff8b5c;
    --accent-dim: #8a4526;
    /* Player-Leiste: nochmals deutlich heller, damit sie sich klar von
       Seite und Kacheln abhebt. */
    --player-bg: #39434f;
    --player-border: #6b7889;
    --player-btn-bg: #151a20; /* dunkle Knöpfe auf hellem Player = hoher Kontrast */
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  header {
    padding: 28px 20px 16px;
    max-width: 900px;
    margin: 0 auto;
  }

  header h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }

  header p {
    color: var(--text-dim);
    font-size: 13px;
    margin: 0;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    /* Seitlich fast randlos, damit die Kacheln die volle Breite nutzen.
       Unten ist der Wert nur ein Fallback - er wird per JS auf die echte
       Höhe der Player-Leiste gesetzt. */
    padding: 12px 6px 100px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 16px;
  }

  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: stretch;
    transition: border-color 0.15s ease, transform 0.1s ease;
    text-align: left;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .card:active {
    transform: scale(0.98);
  }

  .card.active {
    border-color: var(--accent);
  }

  /* Reordering per Ziehgriff (Touch & Maus, siehe attachDragHandlers).
     touch-action: none NUR auf dem Griff - sonst bleibt die Seite überall
     normal scrollbar, nur der Griff selbst startet einen Drag statt Scroll. */
  /* Zeile unter dem Podcast-Namen: Bild + Titel/Datum + Ziehgriff */
  .card-body {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .drag-handle {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 56px;
    margin: 0 -6px 0 0;
    color: var(--text-dim);
    cursor: grab;
  }

  .card.dragging {
    opacity: 0.85;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    z-index: 20;
    cursor: grabbing;
    transition: none;
  }

  .card.dragging .drag-handle {
    cursor: grabbing;
    color: var(--accent);
  }

  .card img {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--border);
    -webkit-user-drag: none;
    user-drag: none;
  }

  .card-text {
    min-width: 0;
    flex: 1;
  }

  .card-podcast {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-title {
    font-size: 14px;
    font-weight: 500;
    margin: 0 0 3px;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-date {
    font-size: 12.5px;
    color: var(--text-dim);
    margin: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .card-listened {
    color: var(--accent);
    font-size: 12px;
  }

  .card.error {
    opacity: 0.5;
    cursor: default;
  }

  .card.loading .card-title { color: var(--text-dim); }

  .card.error { opacity: 0.75; }

  /* Player */
  #player-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--player-bg);
    border-top: 2px solid var(--player-border);
    box-shadow: 0 -10px 24px rgba(0, 0, 0, 0.5);
    padding: 10px 20px 16px;
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }

  #player-bar.visible {
    transform: translateY(0);
  }

  /* Beim Scrollen nach oben (Podcast aussuchen) fährt die Leiste weg und
     gibt die Kacheln frei; beim Scrollen nach unten kommt sie zurück.
     Die ID vorne sorgt dafür, dass diese Regel .visible überstimmt. */
  #player-bar.visible.scrolled-away {
    transform: translateY(100%);
  }

  .player-inner {
    max-width: 900px;
    margin: 0 auto;
  }

  .player-info {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .player-info img {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .player-info-text {
    min-width: 0;
    flex: 1;
  }

  #player-podcast {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
    margin: 0;
  }

  /* Schliessen-Knopf: blendet die Leiste aus, die Folge läuft weiter.
     Zurück kommt sie mit einem Tipp auf den laufenden Podcast. */
  .close-btn {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--player-btn-bg);
    border: 2px solid var(--text);
    color: var(--text);
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    font-family: inherit;
  }

  .close-btn:active {
    background: var(--accent);
    border-color: var(--accent);
    color: #101214;
  }

  #player-title {
    font-size: 14px;
    margin: 2px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Das <audio>-Element bleibt unsichtbar: die nativen Controls sind auf
     dem Handy klein und lassen sich nicht vergrössern. Gesteuert wird
     über die eigenen Knöpfe darunter. */
  audio {
    display: none;
  }

  /* Themen-Zeile */
  .chapter-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .chapter-row[hidden] {
    display: none;
  }

  .chapter-texts {
    min-width: 0;
    flex: 1;
  }

  #chapter-now {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #chapter-next {
    margin: 1px 0 0;
    font-size: 12.5px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chapter-btn {
    flex-shrink: 0;
    background: var(--player-btn-bg);
    border: 1px solid var(--player-border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }

  .chapter-btn:active {
    background: var(--accent-dim);
  }

  /* Fortschrittsbalken mit Zeitangaben */
  .seek-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .seek-row .time {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    min-width: 44px;
    text-align: center;
  }

  #seek {
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    height: 30px; /* grosse Trefferfläche für den Finger */
    margin: 0;
    cursor: pointer;
  }

  #seek::-webkit-slider-runnable-track {
    height: 8px;
    border-radius: 4px;
    background: var(--player-btn-bg);
  }

  #seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px;
    height: 24px;
    margin-top: -8px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
  }

  #seek::-moz-range-track {
    height: 8px;
    border-radius: 4px;
    background: var(--player-btn-bg);
  }

  #seek::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
  }

  /* Grosser Play/Pause-Knopf, flankiert von Folgen-Navigation */
  .transport {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .play-btn {
    width: 78px;
    height: 78px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #101214;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
  }

  .play-btn svg {
    width: 38px;
    height: 38px;
    fill: currentColor;
  }

  .play-btn:active {
    transform: scale(0.96);
  }

  .ep-btn {
    flex: 1 1 0;
    min-width: 0;
    background: var(--player-btn-bg);
    border: 1px solid var(--player-border);
    color: var(--text);
    border-radius: 10px;
    padding: 16px 6px;
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    font-family: inherit;
  }

  .ep-btn:disabled {
    opacity: 0.45;
    cursor: default;
  }

  .ep-btn:not(:disabled):active {
    background: var(--accent-dim);
  }

  /* Kopfzeile mit Aktualisieren-Knopf */
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .icon-btn {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
  }

  .icon-btn.busy {
    opacity: 0.4;
  }

  /* Modus-Zeile: kleinere Schrift und kein Umbruch, damit die Beschriftung
     neben dem Tempo-Knopf immer auf eine Zeile passt. */
  .mode-controls button {
    font-size: 13px;
    padding: 14px 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #speed {
    flex: 0 0 62px;
  }

  .controls {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 8px;
    flex-wrap: nowrap;
  }

  .controls button {
    flex: 1 1 0;
    min-width: 0;
    background: var(--player-btn-bg);
    border: 1px solid var(--player-border);
    color: var(--text);
    border-radius: 10px;
    padding: 16px 4px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }

  .controls button:active {
    background: var(--accent-dim);
  }

  .mode-controls {
    margin-top: 8px;
  }

  /* Aktiver Modus: dunkle Schrift auf Orange. Weiss auf Orange war zu
     kontrastarm, und zusammen mit einem klebenden :hover (orange Schrift
     auf orangem Grund) war der Knopf gar nicht mehr lesbar. */
  .mode-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #101214;
  }

  /* Hover/Tap-Verhalten
     --------------------
     Mobile Browser lassen :hover nach einem Tap "kleben" - Knöpfe blieben
     dadurch dauerhaft orange. Hover-Effekte deshalb nur auf Geräten mit
     echtem Zeiger (Maus/Trackpad); auf Touch zählt nur :active, das
     ausschliesslich beim Drücken gilt. */
  button {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  @media (hover: hover) and (pointer: fine) {
    .card:hover { border-color: var(--accent-dim); }
    .card.error:hover { border-color: var(--border); }
    .controls button:hover { border-color: var(--accent); color: var(--accent); }
    .mode-btn.active:hover { color: #101214; }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  }

  .status {
    color: var(--text-dim);
    font-size: 13px;
    padding: 20px 0;
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1 id="today-date"></h1>
    <button id="refresh" class="icon-btn" aria-label="Folgen neu laden" title="Folgen neu laden">&#x21bb;</button>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div id="player-bar">
  <div class="player-inner">
    <div class="player-info">
      <img id="player-img" src="" alt="">
      <div class="player-info-text">
        <p id="player-podcast"></p>
        <p id="player-title"></p>
      </div>
      <button id="player-close" class="close-btn" aria-label="Player ausblenden" title="Player ausblenden">&times;</button>
    </div>
    <audio id="audio" preload="metadata"></audio>

    <!-- Themen der Folge: nur das laufende und das nächste, mehr würde
         zu viel Platz kosten. Wird ausgeblendet, wenn das Backend für die
         Folge keine Themen erkannt hat. -->
    <div id="chapter-row" class="chapter-row" hidden>
      <div class="chapter-texts">
        <p id="chapter-now"></p>
        <p id="chapter-next"></p>
      </div>
      <button id="skip-chapter" class="chapter-btn" aria-label="Thema überspringen">Thema&nbsp;&#9197;</button>
    </div>

    <div class="seek-row">
      <span id="time-current" class="time">0:00</span>
      <input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Position in der Folge">
      <span id="time-remaining" class="time">-0:00</span>
    </div>

    <div class="transport">
      <button id="prev-episode" class="ep-btn" aria-label="Ältere Folge">&#9664; älter</button>
      <button id="playpause" class="play-btn" aria-label="Abspielen"></button>
      <button id="next-episode" class="ep-btn" aria-label="Neuere Folge">neuer &#9654;</button>
    </div>

    <div class="controls">
      <button id="back10">-10s</button>
      <button id="back5">-5s</button>
      <button id="fwd5">+5s</button>
      <button id="fwd10">+10s</button>
      <button id="fwd30">+30s</button>
    </div>
    <div class="controls mode-controls">
      <button id="mode-series" class="mode-btn">Ganze Serie</button>
      <button id="mode-roundrobin" class="mode-btn">Reihum je 1</button>
      <button id="speed" aria-label="Abspielgeschwindigkeit">1,0&times;</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   KONFIGURATION
   ============================================================ */

// URL des Apps Script Web-App-Deployments (Code.gs), das die Feeds
// als JSON liefert. Muss mit "/exec" enden.
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyHk_vhnKMFkMp3M8KJiS2HDuOEVfysnmOJ6GBYZw2ovPQ-BXYZIXU06s9GbmowjdzX/exec";

// Liste der Podcasts. Einfach weitere Einträge {name, feed} hinzufügen.
const PODCASTS = [
  {
    name: "HeuteMorgen",
    feed: "https://www.srf.ch/feed/podcast/sd/179ababb-4b36-40b2-951d-92d5c207fe9f.xml"
  },
  {
    name: "Handelsblatt Morning Briefing",
    feed: "https://handelsblatt-morningbriefing.podigee.io/feed/mp3"
  },
  {
    name: "DLF Audiobeiträge",
    type: "dlf_audio" // Sonderfall: keine feste Feed-URL, siehe loadPodcast()
  },
  {
    name: "Kalenderblatt",
    feed: "https://www.deutschlandfunk.de/dlf-kalenderblatt-100.xml"
  },
  {
    name: "WDR Kabarett",
    // Derselbe Feed wie "Dieter Nuhr" unten, aber per titleExcludes genau
    // umgekehrt gefiltert: alle Kabarettisten AUSSER Dieter Nuhr.
    feed: "https://www1.wdr.de/mediathek/audio/wdr2/wdr2-kabarett/kabarett-podcast-100.podcast",
    titleExcludes: "Dieter Nuhr"
  },
  {
    name: "Dieter Nuhr",
    // WDR-2-Kabarett-Feed, aber per titleContains auf Dieter Nuhrs
    // Beiträge gefiltert (der Feed mischt mehrere Kabarettisten, jede
    // Episode ist im Titel mit "<Name>: ..." gekennzeichnet).
    feed: "https://www1.wdr.de/mediathek/audio/wdr2/wdr2-kabarett/kabarett-podcast-100.podcast",
    titleContains: "Dieter Nuhr"
  },
  {
    name: "DLF Nachrichten",
    feed: "https://www.deutschlandfunk.de/nachrichten-108.xml",
    minDurationSeconds: 420 // nur Ausgaben ab 7 Min. - Standardausgaben sind ~5 Min., lange sind 8-10 Min.
  },
  {
    name: "Kommentare und Themen der Woche",
    feed: "https://www.deutschlandfunk.de/kommentar-100.xml"
  }
];

// --- Werbung am Anfang/Ende abschneiden ---------------------------
// Manche Podcasts haben vorne und hinten Werbung. Pro Podcast-Name (muss
// exakt dem "name" oben entsprechen) lässt sich hier festlegen, ab welcher
// Sekunde abgespielt und nach welcher Sekunde gestoppt wird. Beim Erreichen
// von endSeconds gilt die Folge als gehört, und es geht genauso weiter wie
// am echten Dateiende (Autoplay-Modi eingeschlossen).
//
// Werte einfach hier anpassen - Schreibweise "Minuten * 60 + Sekunden".
// startSeconds: 0   -> von Anfang an spielen
// endSeconds: null  -> bis zum Dateiende spielen
// adRanges         -> zusätzliche Werbeblöcke MITTEN in der Folge, die
//                     übersprungen werden sollen: [[von, bis], ...]
const PODCAST_TRIM = {
  "Handelsblatt Morning Briefing": {
    // Aufbau der Sendung: Themenvorstellung (ab 0:00) - Werbung (0:38 bis
    // 1:43) - die Themen - Werbung am Schluss.
    // Die Themenvorstellung bleibt also drin; soll sie auch weg, einfach
    // den ersten Bereich auf [0, 1 * 60 + 43] ändern.
    startSeconds: 0,
    endSeconds:   9 * 60 + 5,                  // 9:05 - danach Werbung
    adRanges:     [[0 * 60 + 38, 1 * 60 + 43]] // Werbung nach der Themenvorstellung
  },
  "HeuteMorgen": {
    startSeconds: 29,           // 0:29 - davor Jingle/Vorspann
    endSeconds:   null          // bis zum Ende spielen
  }
};

function getTrim(podcastName) {
  return PODCAST_TRIM[podcastName] || null;
}

/* ------------------------------------------------------------------
   WERBEBEREICHE DER LAUFENDEN FOLGE
   Das Backend (Code.gs) erkennt pro Folge die Werbeblöcke - vorne,
   mitten drin und hinten - und liefert sie als Liste [[von, bis], ...]
   mit. Gibt es für eine Folge keine Analyse, werden die festen Werte
   aus PODCAST_TRIM oben in genau dieselbe Form gebracht. Von da an
   kennt der Player nur noch "Werbebereiche", die er überspringt.
   ------------------------------------------------------------------ */

let activeAdRanges = [];  // [[von, bis], ...] der laufenden Folge
let activeChapters = [];  // [{start, title}, ...] der laufenden Folge

// Baut die Werbebereiche einer Folge: erkannte Bereiche bevorzugt,
// sonst die festen Werte aus PODCAST_TRIM.
function buildAdRanges(podcastName, episode) {
  if (episode && Array.isArray(episode.adRanges) && episode.adRanges.length > 0) {
    return episode.adRanges
      .map((r) => [Number(r[0]), Number(r[1])])
      .filter((r) => isFinite(r[0]) && isFinite(r[1]) && r[1] > r[0])
      .sort((a, b) => a[0] - b[0]);
  }

  const trim = getTrim(podcastName);
  if (!trim) return [];
  const ranges = [];
  if (trim.startSeconds) ranges.push([0, trim.startSeconds]);
  if (Array.isArray(trim.adRanges)) trim.adRanges.forEach((r) => ranges.push([r[0], r[1]]));
  if (trim.endSeconds) ranges.push([trim.endSeconds, Number.MAX_SAFE_INTEGER]);
  return ranges.sort((a, b) => a[0] - b[0]);
}

function audioDuration() {
  return audio.duration && isFinite(audio.duration) ? audio.duration : Infinity;
}

// Werbebereiche, auf die tatsächliche Dateilänge begrenzt.
function adRanges() {
  const duration = audioDuration();
  if (!isFinite(duration)) return activeAdRanges;
  return activeAdRanges
    .map((r) => [Math.max(0, Math.min(r[0], duration)), Math.max(0, Math.min(r[1], duration))])
    .filter((r) => r[1] > r[0]);
}

// Liegt dieser Zeitpunkt in einem Werbeblock? Dann den Bereich liefern.
function adRangeAt(time) {
  const ranges = adRanges();
  for (let i = 0; i < ranges.length; i++) {
    if (time >= ranges[i][0] - 0.05 && time < ranges[i][1]) return ranges[i];
  }
  return null;
}

// Die hörbaren Stücke zwischen den Werbeblöcken.
function playableSegments() {
  const duration = audioDuration();
  if (!isFinite(duration)) return [];
  const segments = [];
  let cursor = 0;
  adRanges().forEach((r) => {
    if (r[0] > cursor) segments.push([cursor, r[0]]);
    cursor = Math.max(cursor, r[1]);
  });
  if (cursor < duration) segments.push([cursor, duration]);
  return segments.filter((seg) => seg[1] - seg[0] > 0.2);
}

function contentStart() {
  const segments = playableSegments();
  return segments.length > 0 ? segments[0][0] : 0;
}

function contentEnd() {
  const segments = playableSegments();
  return segments.length > 0 ? segments[segments.length - 1][1] : audioDuration();
}

// Gesamtlänge ohne Werbung - das ist die Länge, die im Player steht.
function playableLength() {
  return playableSegments().reduce((sum, seg) => sum + (seg[1] - seg[0]), 0);
}

// Echte Position in der Datei -> Position ohne Werbung (für Anzeige/Balken).
function realToPlayable(time) {
  let sum = 0;
  const segments = playableSegments();
  for (let i = 0; i < segments.length; i++) {
    const [from, to] = segments[i];
    if (time < from) return sum;
    if (time <= to) return sum + (time - from);
    sum += to - from;
  }
  return sum;
}

// Umgekehrter Weg: Position ohne Werbung -> echte Position in der Datei.
function playableToReal(position) {
  let remaining = Math.max(0, position);
  const segments = playableSegments();
  for (let i = 0; i < segments.length; i++) {
    const [from, to] = segments[i];
    const length = to - from;
    if (remaining <= length) return from + remaining;
    remaining -= length;
  }
  return segments.length > 0 ? segments[segments.length - 1][1] : 0;
}

// --- Titel aufräumen ----------------------------------------------------
// Manche Feeds stellen jedem Titel immer denselben Textbaustein voran, der
// in der schmalen Kachel nur Platz kostet. Hier lassen sich solche Muster
// ergänzen: "vorne abschneiden, wenn der Titel so anfängt".
const TITLE_PREFIXES_TO_STRIP = [
  /^die\s+nachrichten\s+vom\s+/i   // DLF: "Die Nachrichten vom 20.10.2026, 14:00 Uhr"
];

function cleanEpisodeTitle(title) {
  if (!title) return title;
  let t = String(title).trim();

  TITLE_PREFIXES_TO_STRIP.forEach((pattern) => {
    if (!pattern.test(t)) return;
    t = t.replace(pattern, '');
    // Das Datum gleich mit wegwerfen - es steht ohnehin in der Datumszeile
    // der Kachel. Übrig bleibt z.B. "14:00 Uhr".
    t = t.replace(/^\d{1,2}\.\d{1,2}\.(\d{2,4})?\s*(um|,|-|–|·)?\s*/i, '').trim();
  });

  if (!t) return 'Nachrichten'; // falls vom Titel nichts übrig bleibt
  return t.charAt(0).toUpperCase() + t.slice(1);
}

// --- Umbenannte Podcasts ------------------------------------------------
// Beim Umbenennen einer Kachel würden Reihenfolge, Hörfortschritt und
// Cover unter dem alten Namen liegenbleiben. Diese Tabelle zieht sie beim
// Start einmalig auf den neuen Namen um.
const RENAMED_PODCASTS = {
  'DLF Nachrichten (lang)': 'DLF Nachrichten'
};

function migrateRenamedPodcasts() {
  const renames = Object.keys(RENAMED_PODCASTS);
  if (renames.length === 0) return;

  [STORAGE_KEY, IMAGE_KEY].forEach((key) => {
    let data;
    try {
      data = JSON.parse(localStorage.getItem(key));
    } catch (e) {
      return;
    }
    if (!data || typeof data !== 'object') return;
    let changed = false;
    renames.forEach((oldName) => {
      const newName = RENAMED_PODCASTS[oldName];
      if (data[oldName] && !data[newName]) {
        data[newName] = data[oldName];
        changed = true;
      }
      if (data[oldName]) {
        delete data[oldName];
        changed = true;
      }
    });
    if (changed) {
      try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
    }
  });

  try {
    const order = JSON.parse(localStorage.getItem(ORDER_KEY));
    if (Array.isArray(order)) {
      const mapped = order.map((n) => RENAMED_PODCASTS[n] || n);
      localStorage.setItem(ORDER_KEY, JSON.stringify(mapped));
    }
  } catch (e) {}
}

// Wendet eine per Drag & Drop gespeicherte Reihenfolge auf PODCASTS an.
// Podcasts ohne Eintrag in der gespeicherten Reihenfolge (z.B. neu im
// Code hinzugefügt) werden hinten in ihrer ursprünglichen Reihenfolge
// angehängt; Einträge in der gespeicherten Reihenfolge, die es nicht
// mehr gibt, werden einfach ignoriert.
function getOrderedPodcasts() {
  let savedOrder = [];
  try {
    savedOrder = JSON.parse(localStorage.getItem(ORDER_KEY)) || [];
  } catch (e) {
    savedOrder = [];
  }

  const remaining = new Map(PODCASTS.map((p) => [p.name, p]));
  const ordered = [];
  savedOrder.forEach((name) => {
    if (remaining.has(name)) {
      ordered.push(remaining.get(name));
      remaining.delete(name);
    }
  });
  PODCASTS.forEach((p) => {
    if (remaining.has(p.name)) ordered.push(p);
  });
  return ordered;
}

   ============================================================ */

const STORAGE_KEY = 'podcastPlayerState_v2';
const ORDER_KEY = 'podcastOrder_v1';
const IMAGE_KEY = 'podcastImages_v1';

// --- Cover-Bilder: pro Podcast EINE feste URL, ein Jahr lang -------------
// Vorher wurde das Bild der jeweiligen Episode benutzt. Da sich diese URL
// mit jeder neuen Folge ändert, musste der Browser jedes Mal ein neues Bild
// herunterladen. Jetzt wird pro Podcast die zuerst gesehene Cover-URL in
// localStorage festgehalten und ein Jahr lang weiterverwendet - dadurch ist
// die URL stabil, der Service-Worker-Cache greift (siehe sw.js) und es
// entsteht im Normalbetrieb überhaupt kein Bild-Download mehr.
const IMAGE_MAX_AGE_MS = 365 * 24 * 3600 * 1000;

function loadImageCache() {
  try {
    return JSON.parse(localStorage.getItem(IMAGE_KEY)) || {};
  } catch (e) {
    return {};
  }
}

function saveImageCache(cache) {
  try {
    localStorage.setItem(IMAGE_KEY, JSON.stringify(cache));
  } catch (e) {
    console.error('Cover-Cache konnte nicht gespeichert werden', e);
  }
}

// Liefert die gemerkte Cover-URL des Podcasts. Ist noch keine gemerkt oder
// ist der Eintrag älter als ein Jahr, wird die aktuelle URL aus dem Feed
// übernommen und neu gemerkt.
function getPodcastImage(podcastName, feedImageUrl) {
  const cache = loadImageCache();
  const entry = cache[podcastName];
  const fresh = entry && entry.url && (Date.now() - (entry.ts || 0)) < IMAGE_MAX_AGE_MS;
  if (fresh) return entry.url;
  if (!feedImageUrl) return entry && entry.url ? entry.url : '';
  cache[podcastName] = { url: feedImageUrl, ts: Date.now() };
  saveImageCache(cache);
  return feedImageUrl;
}

// Setzt das Bild nur, wenn sich die URL wirklich ändert - ein erneutes
// Zuweisen derselben src lässt den Browser sonst kurz neu dekodieren
// (sichtbares Flackern beim Umblättern der Folgen).
function setImageSrc(imgEl, url) {
  if (!imgEl || !url) return;
  if (imgEl.getAttribute('src') !== url) imgEl.src = url;
}

function loadAllState() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) {
    return {};
  }
}

function saveAllState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('localStorage-Fehler', e);
  }
}

function getPodcastState(allState, podcastName) {
  if (!allState[podcastName]) {
    allState[podcastName] = {
      lastSeenGuid: null,
      currentIndex: 0,
      progress: {},   // guid -> Sekunden
      listened: {}    // guid -> true
    };
  }
  return allState[podcastName];
}

const WEEKDAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

function formatDateNoYear(pubDate) {
  if (!pubDate) return '';
  const d = new Date(pubDate);
  if (isNaN(d)) return pubDate;
  const wd = WEEKDAYS[d.getDay()];
  const day = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const time = d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
  return `${wd}, ${day}.${month}., ${time}`;
}

// Normalisiert die Dauer-Angabe aus dem Feed (kommt uneinheitlich an:
// mal schon als "12:34"/"1:02:03" von itunes:duration, mal als reine
// Sekundenzahl wie "754" bei den DLF-Audiobeiträgen) zu einem
// einheitlichen "M:SS" bzw. "H:MM:SS"-Format fürs Anzeigen.
function formatDuration(duration) {
  if (!duration) return '';
  const trimmed = String(duration).trim();

  // Schon im "M:SS" oder "H:MM:SS"-Format -> unverändert übernehmen
  if (/^\d{1,2}(:\d{2}){1,2}$/.test(trimmed)) {
    return trimmed;
  }

  // Reine Sekundenzahl -> in M:SS bzw. H:MM:SS umrechnen
  const totalSeconds = parseInt(trimmed, 10);
  if (isNaN(totalSeconds) || totalSeconds < 0) return '';

  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;

  if (h > 0) {
    return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }
  return `${m}:${String(s).padStart(2, '0')}`;
}

// Zeigt Wochentag + Datum (ohne Jahr) oben auf der Seite an, z.B.

async function loadPodcast(podcast, card) {
  try {
    const url = podcast.type === 'dlf_audio'
      ? PROXY_URL + '?mode=dlfaudio'
      : PROXY_URL + '?feed=' + encodeURIComponent(podcast.feed) +
        (podcast.minDurationSeconds ? '&minDuration=' + podcast.minDurationSeconds : '') +
        (podcast.titleContains ? '&titleContains=' + encodeURIComponent(podcast.titleContains) : '') +
        (podcast.titleExcludes ? '&titleExcludes=' + encodeURIComponent(podcast.titleExcludes) : '');
    const res = await fetch(url);
    const data = await res.json();

    if (data.error || !data.episodes || data.episodes.length === 0) {
      showCardError(card, podcast, data.error || 'Kein Audio gefunden');
      return;
    }

    card.classList.remove('loading', 'error');
    card.dataset.podcastName = podcast.name;
    data.episodes.forEach((ep) => { ep.title = cleanEpisodeTitle(ep.title); });
    card.episodes = data.episodes; // neueste zuerst, Index 0 = neueste

    const allState = loadAllState();
    const pState = getPodcastState(allState, podcast.name);
    const newestGuid = data.episodes[0].guid;

    // Läuft gerade eine Folge dieser Kachel, darf ein Neuladen die Anzeige
    // nicht wegspringen lassen - dann bleibt der aktuelle Index stehen.
    const isPlayingThisCard = activeEpisode && activeEpisode.podcastName === podcast.name && !audio.paused;

    // Neue Episode seit letztem Besuch? -> immer die neueste zeigen
    if (pState.lastSeenGuid !== newestGuid) {
      pState.lastSeenGuid = newestGuid;
      if (!isPlayingThisCard) pState.currentIndex = 0;
    }
    // Falls gespeicherter Index nicht mehr existiert (Feed kürzer geworden)
    if (pState.currentIndex >= data.episodes.length) {
      pState.currentIndex = 0;
    }
    saveAllState(allState);

    // Läuft eine Folge dieser Kachel, den Index auf genau diese Folge
    // nachziehen (im Feed kann sie durch neue Folgen verschoben sein).
    if (isPlayingThisCard) {
      const playingIdx = data.episodes.findIndex(e => e.guid === activeEpisode.guid);
      if (playingIdx !== -1) pState.currentIndex = playingIdx;
      saveAllState(allState);
    }

    renderCard(card, podcast.name, pState.currentIndex);

    // Klick-/Drag-Handler nur beim ersten erfolgreichen Laden anhängen,
    // damit ein Neuladen keine doppelten Handler erzeugt.
    if (!card.dataset.wired) {
      card.dataset.wired = '1';
      card.addEventListener('click', () => onCardClick(card));
      attachDragHandlers(card, card.querySelector('.drag-handle'));
    }
    updateEpisodeNavButtons();
  } catch (err) {
    showCardError(card, podcast, 'Fehler beim Laden - tippen für neuen Versuch');
    console.error(podcast.name, err);
  }
}

// Fehler auf der Kachel anzeigen. Ein Tipp darauf versucht es erneut -
// vorher musste man dafür die ganze Seite neu laden.
function showCardError(card, podcast, message) {
  card.classList.remove('loading');
  card.classList.add('error');
  card.querySelector('.card-title').textContent = message;
  if (!card.dataset.retryWired) {
    card.dataset.retryWired = '1';
    card.addEventListener('click', () => {
      if (!card.classList.contains('error')) return;
      card.classList.remove('error');
      card.classList.add('loading');
      card.querySelector('.card-title').textContent = 'Wird geladen …';
      loadPodcast(card.podcast || podcast, card);
    });
  }
}

// Titel/Interpret/Cover für Lockscreen, Kopfhörer und Autoradio.
// Das Cover wird dem Betriebssystem als URL übergeben; ob das Auto es
// anzeigt, hängt vom Bluetooth-Profil des Autoradios ab (Cover-Art gibt es
// erst ab AVRCP 1.6) - Titel und Podcast-Name kommen praktisch überall an.
function setMediaMetadata(podcastName, episode, coverUrl) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: episode.title || podcastName,
    artist: podcastName,
    album: formatDateNoYear(episode.pubDate),
    artwork: coverUrl ? [{ src: coverUrl, sizes: '512x512' }] : []
  });
}

/* ============================================================
   REORDERING: Ziehgriff, Touch & Maus über Pointer Events.
   Der Griff hat touch-action: none (siehe CSS) - nur dadurch lässt
   sich das native Scrollen von Android/iOS beim Ziehen zuverlässig
   unterdrücken. Ohne dediziertem Griff (z.B. bei Drag auf der ganzen
   Karte) kann das Betriebssystem die Touch-Geste als Scroll kapern,
   auch wenn preventDefault() im JS aufgerufen wird.
   ============================================================ */

const DRAG_JITTER_PX = 6; // Mindestbewegung, bevor eine Geste als Drag zählt (Tap-Schutz)

function persistCardOrder() {
  const order = Array.from(grid.children).map((c) => c.dataset.podcastName).filter(Boolean);
  try {
    localStorage.setItem(ORDER_KEY, JSON.stringify(order));
  } catch (e) {
    console.error('Reihenfolge konnte nicht gespeichert werden', e);
  }
}

// Findet die Geschwister-Karte, deren Mittelpunkt dem Pointer am
// nächsten ist, und ob vor oder nach ihr eingefügt werden soll.
function findDropTarget(clientX, clientY, excludeCard) {
  let closest = null;
  let closestDist = Infinity;
  Array.from(grid.children).forEach((sib) => {
    if (sib === excludeCard) return;
    const rect = sib.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dist = Math.hypot(clientX - cx, clientY - cy);
    if (dist < closestDist) {
      closestDist = dist;
      closest = { el: sib, cy };
    }
  });
  return closest;
}

function attachDragHandlers(card, handle) {
  handle.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();

    const startX = e.clientX;
    const startY = e.clientY;
    const pointerId = e.pointerId;
    let dragStarted = false; // erste nennenswerte Bewegung erreicht (Tap-Schutz)

    try { handle.setPointerCapture(pointerId); } catch (err) {}
    card.classList.add('dragging');

    function onMove(ev) {
      if (ev.pointerId !== pointerId) return;
      ev.preventDefault();

      if (!dragStarted) {
        const dx = ev.clientX - startX;
        const dy = ev.clientY - startY;
        if (Math.hypot(dx, dy) < DRAG_JITTER_PX) return;
        dragStarted = true;
      }

      const target = findDropTarget(ev.clientX, ev.clientY, card);
      if (target) {
        if (ev.clientY < target.cy) grid.insertBefore(card, target.el);
        else grid.insertBefore(card, target.el.nextSibling);
      }

      // Transform aus der AKTUELLEN (durch das Umsortieren ggf. neuen)
      // natürlichen Position neu berechnen - sonst "springt" die Karte
      // relativ zum Finger weg, sobald sich ihre DOM-Position ändert.
      card.style.transform = 'none';
      const rect = card.getBoundingClientRect();
      const tx = ev.clientX - (rect.left + rect.width / 2);
      const ty = ev.clientY - (rect.top + rect.height / 2);
      card.style.transform = `translate(${tx}px, ${ty}px)`;
    }

    function onUp(ev) {
      if (ev.pointerId !== pointerId) return;
      card.classList.remove('dragging');
      card.style.transform = '';
      try { handle.releasePointerCapture(pointerId); } catch (err) {}
      if (dragStarted) persistCardOrder();
      cleanup();
    }

    function cleanup() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });

  // Ein Klick auf den Griff soll nie die Kachel als "Karte angeklickt"
  // behandeln (würde sonst die Folge starten/weiterblättern).
  handle.addEventListener('click', (e) => e.stopPropagation());

  // Verhindert das native Long-Press-Kontextmenü auf dem Griff.
  handle.addEventListener('contextmenu', (e) => e.preventDefault());
}

function onCardClick(card) {
  // Ist die Leiste gerade ausgeblendet (weggewischt oder mit × geschlossen)
  // und man tippt die laufende Kachel an, soll NUR die Leiste zurückkommen -
  // sonst würde dieser Tipp wie gewohnt eine Folge weiterblättern.
  if (activeCard === card && isPlayerBarHidden()) {
    showPlayerBar();
    // Mit × geschlossen (= angehalten)? Dann an derselben Stelle weiterspielen.
    if (audio.src && audio.paused && !activeEpisodeEnded) audio.play();
    return;
  }

  setAutoplayMode(null); // manueller Klick bricht einen laufenden Abspiel-Modus ab

  const podcastName = card.dataset.podcastName;
  const allState = loadAllState();
  const pState = getPodcastState(allState, podcastName);

  if (activeCard === card) {
    if (activeEpisodeEnded) {
      // Folge ist gerade zu Ende gelaufen und die Anzeige wurde bereits
      // auf die nächstältere Folge vorgerückt -> die jetzt einfach abspielen,
      // nicht nochmal weiterspringen.
    } else {
      // Card ist aktiv, aber Folge läuft noch/ist pausiert -> manuell
      // eine Folge weiter zurückblättern.
      pState.currentIndex = Math.min(pState.currentIndex + 1, card.episodes.length - 1);
      saveAllState(allState);
    }
  }
  // Andere/erste Karte -> aktuellen (ggf. gespeicherten) Index einfach abspielen

  // Sind wir bereits bei der ältesten geladenen Folge UND die wurde schon
  // gehört (egal ob in dieser oder einer früheren Sitzung) -> nicht erneut
  // abspielen, sondern nur den "keine ältere Folge"-Hinweis zeigen. Ohne
  // diese Prüfung würde ein erneuter Klick die letzte Folge endlos
  // wiederholen, sobald man einmal ganz durch ist.
  const currentEpisode = card.episodes[pState.currentIndex];
  const isOldest = pState.currentIndex === card.episodes.length - 1;
  const oldestAlreadyListened = isOldest && !!pState.listened[currentEpisode.guid];

  if (oldestAlreadyListened) {
    renderCard(card, podcastName, pState.currentIndex, { noOlder: true });
    activeCard = card;
    return;
  }

  renderCard(card, podcastName, pState.currentIndex);
  playEpisode(card, podcastName, pState.currentIndex);
  activeCard = card;
}

function playEpisode(card, podcastName, index) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  card.classList.add('active');
  activeCard = card; // schon hier setzen - die Aufrufer tun es sonst erst danach,
                     // und die Folgen-Knöpfe unten brauchen die aktive Karte

  const episode = card.episodes[index];
  const allState = loadAllState();
  const pState = getPodcastState(allState, podcastName);

  const coverUrl = getPodcastImage(podcastName, episode.imageUrl);
  setImageSrc(playerImg, coverUrl);
  playerPodcast.textContent = podcastName;
  playerTitle.textContent = (episode.title || '') + '  ·  ' + formatDateNoYear(episode.pubDate);

  audio.src = episode.audioUrl;
  activeEpisode = { podcastName, guid: episode.guid };
  activeEpisodeEnded = false;
  activeAdRanges = buildAdRanges(podcastName, episode);
  activeChapters = Array.isArray(episode.chapters) ? episode.chapters.slice() : [];
  applyPlaybackRate();

  setMediaMetadata(podcastName, episode, coverUrl);

  const savedProgress = pState.progress[episode.guid];
  const resume = () => {
    // Gespeicherte Position nur übernehmen, wenn sie im hörbaren Bereich
    // liegt und nicht praktisch am Ende - sonst beim Inhalt anfangen.
    const start = contentStart();
    const end = contentEnd();
    const useSaved = savedProgress &&
      savedProgress > start + 5 &&
      savedProgress < end - 15 &&
      !adRangeAt(savedProgress);
    const startAt = useSaved ? savedProgress : start;
    if (startAt > 0) audio.currentTime = startAt;
    audio.removeEventListener('loadedmetadata', resume);
    updateTransportUI();
  };
  audio.addEventListener('loadedmetadata', resume);

  audio.play();
  playerBar.classList.add('visible');
  showPlayerBar(); // beim Starten einer Folge immer zeigen
  syncMainPadding();
  updateEpisodeNavButtons();
  updateTransportUI();
}

// Speichert nur die Wiedergabeposition (und markiert bei Bedarf als
// gehört). Rendert bewusst NICHTS - das übernimmt ausschliesslich der
// 'ended'-Handler, damit es nicht zu widersprüchlichen Neu-Renderings
// zwischen 'pause' (das vor 'ended' feuert) und 'ended' kommt.
function persistProgress() {
  if (!activeEpisode || !audio.duration) return;
  const allState = loadAllState();
  const pState = getPodcastState(allState, activeEpisode.podcastName);
  pState.progress[activeEpisode.guid] = audio.currentTime;

  // "Gehört" bezieht sich auf den hörbaren Teil ohne Werbung - sonst würde
  // eine Folge mit Werbung am Schluss nie 95% erreichen.
  const total = playableLength();
  if (total > 0 && realToPlayable(audio.currentTime) / total > 0.95) {
    pState.listened[activeEpisode.guid] = true;
  }
  saveAllState(allState);
}

audio.addEventListener('timeupdate', () => {
  if (activeEpisode && !activeEpisodeEnded) {
    // Mitten in einem Werbeblock gelandet (am Anfang, zwischendrin oder am
    // Schluss)? Dann sofort ans Ende dieses Blocks springen.
    const ad = adRangeAt(audio.currentTime);
    if (ad) {
      if (ad[1] >= contentEnd() - 0.2) {
        // Nach diesem Block kommt nur noch Werbung -> Folge ist zu Ende.
        audio.pause();
        persistProgress();
        handleEpisodeEnd();
        return;
      }
      audio.currentTime = ad[1] + 0.05;
      updateTransportUI();
      return;
    }

    if (audio.currentTime >= contentEnd() - 0.05) {
      audio.pause();
      persistProgress();
      handleEpisodeEnd();
      return;
    }
  }
  updateTransportUI();
  clearTimeout(saveProgressTimer);
  saveProgressTimer = setTimeout(persistProgress, 3000);
});
audio.addEventListener('pause', persistProgress);
audio.addEventListener('loadedmetadata', updateTransportUI);
audio.addEventListener('durationchange', updateTransportUI);

/* ============================================================
   EIGENER TRANSPORT: grosser Play/Pause-Knopf, Fortschrittsbalken
   mit Zeitangaben, Folgen-Navigation und Geschwindigkeit.
   Alle Zeiten beziehen sich auf den getrimmten Bereich (siehe
   PODCAST_TRIM): abgeschnittene Werbung zählt weder im Balken
   noch in der Restzeit mit.
   ============================================================ */

const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';

let isSeeking = false;

function formatSeconds(totalSeconds) {
  if (!isFinite(totalSeconds) || totalSeconds < 0) totalSeconds = 0;
  const t = Math.floor(totalSeconds);
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const sec = t % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  return `${m}:${String(sec).padStart(2, '0')}`;
}

// Fortschrittsbalken und Zeiten rechnen in "Hörzeit ohne Werbung".
function playableWindow() {
  return { start: contentStart(), end: contentEnd(), length: playableLength() };
}

function updatePlayPauseIcon() {
  if (!playPauseBtn) return;
  const paused = audio.paused;
  playPauseBtn.innerHTML = paused ? ICON_PLAY : ICON_PAUSE;
  playPauseBtn.setAttribute('aria-label', paused ? 'Abspielen' : 'Pause');
}

function updateTransportUI() {
  updatePlayPauseIcon();
  if (!seekEl) return;
  const win = playableWindow();

  if (win.length <= 0) {
    if (!isSeeking) seekEl.value = '0';
    timeCurrentEl.textContent = '0:00';
    timeRemainingEl.textContent = '-0:00';
    return;
  }

  const pos = Math.min(Math.max(realToPlayable(audio.currentTime), 0), win.length);
  if (!isSeeking) seekEl.value = String(Math.round((pos / win.length) * 1000));
  timeCurrentEl.textContent = formatSeconds(pos);
  timeRemainingEl.textContent = '-' + formatSeconds(win.length - pos);

  // Position auch ans Betriebssystem melden - Lockscreen und viele
  // Autoradios zeigen damit einen korrekten Fortschritt an.
  updateChapterUI();

  if ('mediaSession' in navigator && navigator.mediaSession.setPositionState) {
    try {
      navigator.mediaSession.setPositionState({
        duration: win.length,
        position: pos,
        playbackRate: audio.playbackRate || 1
      });
    } catch (e) { /* ungültige Werte (z.B. während des Ladens) ignorieren */ }
  }
}

function togglePlayPause() {
  if (!audio.src) return;
  if (audio.paused) {
    // Am Ende des Inhalts erneut auf Play: wieder vorne anfangen statt
    // sofort wieder zu stoppen.
    if (playableLength() > 0 && audio.currentTime >= contentEnd() - 0.5) {
      audio.currentTime = contentStart();
      activeEpisodeEnded = false;
    }
    audio.play();
  } else {
    audio.pause();
  }
}

if (playPauseBtn) playPauseBtn.addEventListener('click', togglePlayPause);

if (seekEl) {
  seekEl.addEventListener('pointerdown', () => { isSeeking = true; });
  seekEl.addEventListener('input', () => {
    isSeeking = true;
    const win = playableWindow();
    if (win.length <= 0) return;
    const pos = (Number(seekEl.value) / 1000) * win.length;
    timeCurrentEl.textContent = formatSeconds(pos);
    timeRemainingEl.textContent = '-' + formatSeconds(win.length - pos);
  });
  seekEl.addEventListener('change', () => {
    const win = playableWindow();
    if (win.length > 0) {
      // Der Balken kennt nur Hörzeit ohne Werbung - zurückrechnen.
      audio.currentTime = playableToReal((Number(seekEl.value) / 1000) * win.length);
      activeEpisodeEnded = false;
    }
    isSeeking = false;
    updateTransportUI();
  });
}

/* ------------------------------------------------------------------
   THEMEN (KAPITEL)
   Das Backend gliedert die Folge in Themen. Angezeigt werden bewusst
   nur zwei: das laufende und das nächste. "Thema ⏭" springt zum
   Anfang des nächsten Themas; liegt dazwischen Werbung, überspringt
   der Player sie wie gewohnt automatisch.
   ------------------------------------------------------------------ */

// Index des Themas, das gerade läuft (-1, wenn es keine Themen gibt).
function currentChapterIndex() {
  if (activeChapters.length === 0) return -1;
  let idx = 0;
  for (let i = 0; i < activeChapters.length; i++) {
    if (audio.currentTime + 0.25 >= activeChapters[i].start) idx = i;
  }
  return idx;
}

function updateChapterUI() {
  if (!chapterRow) return;

  if (activeChapters.length === 0) {
    chapterNowEl.textContent = '';
    chapterNextEl.textContent = '';
    if (!chapterRow.hasAttribute('hidden')) {
      chapterRow.setAttribute('hidden', '');
      syncMainPadding();
    }
    return;
  }

  const idx = currentChapterIndex();
  const next = activeChapters[idx + 1];
  chapterNowEl.textContent = activeChapters[idx] ? activeChapters[idx].title : '';
  chapterNextEl.textContent = next ? 'Danach: ' + next.title : 'Letztes Thema';
  if (skipChapterBtn) skipChapterBtn.disabled = false;

  if (chapterRow.hasAttribute('hidden')) {
    chapterRow.removeAttribute('hidden');
    syncMainPadding();
  }
}

// Zum nächsten Thema springen. Gibt es keines mehr, ans Ende des Inhalts
// springen - dann greift die normale "Folge zu Ende"-Behandlung.
function skipToNextChapter() {
  if (activeChapters.length === 0) return;
  const idx = currentChapterIndex();
  const next = activeChapters[idx + 1];

  if (next) {
    audio.currentTime = next.start;
    activeEpisodeEnded = false;
    if (audio.paused) audio.play();
    updateTransportUI();
    return;
  }

  audio.pause();
  persistProgress();
  handleEpisodeEnd();
}

if (skipChapterBtn) skipChapterBtn.addEventListener('click', skipToNextChapter);

// --- Folgen-Navigation ---------------------------------------------------
// delta = +1 -> eine Folge älter, -1 -> eine Folge neuer.
function goToEpisode(delta) {
  if (!activeCard || !activeEpisode || !activeCard.episodes) return;
  const idx = activeCard.episodes.findIndex(e => e.guid === activeEpisode.guid);
  if (idx === -1) return;
  const target = idx + delta;
  if (target < 0 || target >= activeCard.episodes.length) return;

  const podcastName = activeEpisode.podcastName;
  const allState = loadAllState();
  const pState = getPodcastState(allState, podcastName);
  pState.currentIndex = target;
  saveAllState(allState);
  renderCard(activeCard, podcastName, target);
  playEpisode(activeCard, podcastName, target);
}

function updateEpisodeNavButtons() {
  if (!prevEpisodeBtn || !nextEpisodeBtn) return;
  let idx = -1;
  let total = 0;
  if (activeCard && activeEpisode && activeCard.episodes) {
    idx = activeCard.episodes.findIndex(e => e.guid === activeEpisode.guid);
    total = activeCard.episodes.length;
  }
  prevEpisodeBtn.disabled = idx === -1 || idx + 1 >= total;
  nextEpisodeBtn.disabled = idx <= 0;
}

if (prevEpisodeBtn) prevEpisodeBtn.addEventListener('click', () => goToEpisode(1));
if (nextEpisodeBtn) nextEpisodeBtn.addEventListener('click', () => goToEpisode(-1));

// --- Abspielgeschwindigkeit (wird gemerkt) -------------------------------
const SPEED_KEY = 'podcastSpeed_v1';
const SPEEDS = [1, 1.1, 1.2];

function loadSpeed() {
  const stored = parseFloat(localStorage.getItem(SPEED_KEY) || '1');
  return SPEEDS.indexOf(stored) === -1 ? 1 : stored;
}

let playbackSpeed = loadSpeed();

// Label fürs Knopf-Beschriften: 1 -> "1,0×", 1.25 -> "1,25×"
function speedLabel(rate) {
  const text = Number.isInteger(rate) ? rate.toFixed(1) : String(rate);
  return text.replace('.', ',') + '×';
}

function applyPlaybackRate() {
  audio.playbackRate = playbackSpeed;
  if (speedBtn) speedBtn.textContent = speedLabel(playbackSpeed);
}

if (speedBtn) {
  speedBtn.addEventListener('click', () => {
    const next = SPEEDS[(SPEEDS.indexOf(playbackSpeed) + 1) % SPEEDS.length];
    playbackSpeed = next;
    try { localStorage.setItem(SPEED_KEY, String(next)); } catch (e) {}
    applyPlaybackRate();
  });
}

/* ============================================================
   ABSPIEL-MODI: zwei Buttons, die beim Folgenende automatisch
   weiterspielen. Nur einer kann gleichzeitig aktiv sein; beide
   stoppen sich selbst am Ende (keine Endlosschleife).
   - "Ganze Serie": spielt ab der aktuell aktiven Kachel alle
     älteren Folgen desselben Podcasts nacheinander durch.
   - "Reihum, je 1 Folge": spielt ab der aktuell aktiven Kachel
     genau eine Folge pro Podcast, einmal reihum durch alle
     geladenen Kacheln (Grid-Reihenfolge), dann Stopp.
   ============================================================ */

let autoplayMode = null; // null | 'series' | 'round-robin'
let roundRobinOrder = [];
let roundRobinStartIdx = 0;
let roundRobinStep = 0;

const modeSeriesBtn = document.getElementById('mode-series');
const modeRoundRobinBtn = document.getElementById('mode-roundrobin');

function setAutoplayMode(mode) {
  autoplayMode = mode;
  if (modeSeriesBtn) modeSeriesBtn.classList.toggle('active', mode === 'series');
  if (modeRoundRobinBtn) modeRoundRobinBtn.classList.toggle('active', mode === 'round-robin');
}

// Spielt die aktuell auf der Karte angezeigte Folge, ausser sie läuft
// (bzw. ist pausiert) bereits genau so - dann nicht neu starten.
function ensurePlaying(card) {
  const podcastName = card.dataset.podcastName;
  const allState = loadAllState();
  const pState = getPodcastState(allState, podcastName);
  const currentEpisode = card.episodes[pState.currentIndex];
  const alreadyPlayingThis = activeCard === card && activeEpisode &&
    currentEpisode && activeEpisode.guid === currentEpisode.guid;
  if (!alreadyPlayingThis) {
    renderCard(card, podcastName, pState.currentIndex);
    playEpisode(card, podcastName, pState.currentIndex);
    activeCard = card;
  }
}

if (modeSeriesBtn) {
  modeSeriesBtn.addEventListener('click', () => {
    if (autoplayMode === 'series') {
      setAutoplayMode(null);
      return;
    }
    if (!activeCard) return;
    ensurePlaying(activeCard);
    setAutoplayMode('series');
  });
}

if (modeRoundRobinBtn) {
  modeRoundRobinBtn.addEventListener('click', () => {
    if (autoplayMode === 'round-robin') {
      setAutoplayMode(null);
      return;
    }
    if (!activeCard) return;
    const order = Array.from(grid.children).filter((c) => c.episodes && c.episodes.length > 0);
    const startIdx = order.indexOf(activeCard);
    if (startIdx === -1) return;
    roundRobinOrder = order;
    roundRobinStartIdx = startIdx;
    roundRobinStep = 0;
    ensurePlaying(activeCard);
    setAutoplayMode('round-robin');
  });
}

// Springt zur nächsten Kachel der beim Start festgelegten Runde und
// spielt deren aktuelle Folge. Nach genau einer vollen Runde (jede
// Kachel einmal) wird der Modus automatisch beendet.
function advanceRoundRobin() {
  roundRobinStep++;
  if (roundRobinStep >= roundRobinOrder.length) {
    setAutoplayMode(null);
    return;
  }
  const nextCard = roundRobinOrder[(roundRobinStartIdx + roundRobinStep) % roundRobinOrder.length];
  const podcastName = nextCard.dataset.podcastName;
  const allState = loadAllState();
  const pState = getPodcastState(allState, podcastName);
  if (!nextCard.episodes || pState.currentIndex >= nextCard.episodes.length) {
    setAutoplayMode(null);
    return;
  }
  renderCard(nextCard, podcastName, pState.currentIndex);
  playEpisode(nextCard, podcastName, pState.currentIndex);
  activeCard = nextCard;
}

// Wird sowohl vom echten 'ended'-Event aufgerufen als auch dann, wenn ein
// konfiguriertes Trim-Ende (Werbung am Schluss) erreicht ist.
function handleEpisodeEnd() {
  if (!activeEpisode || !activeCard) return;
  activeEpisodeEnded = true;

  const podcastName = activeEpisode.podcastName;
  const allState = loadAllState();
  const pState = getPodcastState(allState, podcastName);
  pState.listened[activeEpisode.guid] = true;

  const finishedIndex = activeCard.episodes.findIndex(e => e.guid === activeEpisode.guid);
  const nextIndex = finishedIndex + 1; // eine Folge älter
  const hasOlder = finishedIndex !== -1 && nextIndex < activeCard.episodes.length;

  if (hasOlder) {
    pState.currentIndex = nextIndex;
    saveAllState(allState);
    renderCard(activeCard, podcastName, nextIndex);
    if (autoplayMode === 'series') {
      // "Ganze Serie" aktiv -> ältere Folge direkt abspielen statt nur anzuzeigen.
      playEpisode(activeCard, podcastName, nextIndex);
    } else {
      updatePlayerPreview(activeCard, podcastName, nextIndex);
    }
  } else {
    // Keine ältere Folge mehr geladen -> das auf der Karte anzeigen,
    // bis neue Folgen nachkommen.
    if (finishedIndex !== -1) pState.currentIndex = finishedIndex;
    saveAllState(allState);
    renderCard(activeCard, podcastName, finishedIndex !== -1 ? finishedIndex : pState.currentIndex, { noOlder: true });
    if (autoplayMode === 'series') {
      setAutoplayMode(null); // Serie komplett durch -> stoppen
    }
  }

  if (autoplayMode === 'round-robin') {
    advanceRoundRobin();
  }

  updateEpisodeNavButtons();
  updateTransportUI();
}

audio.addEventListener('ended', handleEpisodeEnd);

window.addEventListener('beforeunload', persistProgress);

function skip(seconds) {
  if (!audio.src) return;
  // In Hörzeit springen, damit übersprungene Werbung nicht mitzählt und
  // man nicht in einem Werbeblock landet.
  const total = playableLength();
  if (total <= 0) {
    audio.currentTime = Math.max(0, audio.currentTime + seconds);
    return;
  }
  const target = Math.max(0, Math.min(total - 0.5, realToPlayable(audio.currentTime) + seconds));
  audio.currentTime = playableToReal(target);
}

document.getElementById('back10').addEventListener('click', () => skip(-10));
document.getElementById('back5').addEventListener('click', () => skip(-5));
document.getElementById('fwd5').addEventListener('click', () => skip(5));
document.getElementById('fwd10').addEventListener('click', () => skip(10));
document.getElementById('fwd30').addEventListener('click', () => skip(30));

/* ============================================================
   MEDIA SESSION - externe Buttons (Lockscreen, Kopfhörer, Auto)
   Play/Pause steuert die Wiedergabe, seekbackward/-forward sind
   fest auf -5s / +10s gelegt (wie gewünscht, unabhängig davon,
   was das Betriebssystem als Standardsprung vorschlägt).
   previoustrack/nexttrack springen zur älteren/neueren Folge.
   ============================================================ */

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('seekbackward', () => skip(-5));
  navigator.mediaSession.setActionHandler('seekforward', () => skip(10));

  navigator.mediaSession.setActionHandler('previoustrack', () => goToEpisode(1));  // älter
  navigator.mediaSession.setActionHandler('nexttrack', () => goToEpisode(-1));     // neuer

  // Scrubben vom Lockscreen/Autoradio aus - die Position kommt relativ zum
  // hörbaren Bereich (ohne Werbung), muss also umgerechnet werden.
  if ('setActionHandler' in navigator.mediaSession) {
    try {
      navigator.mediaSession.setActionHandler('seekto', (details) => {
        if (typeof details.seekTime !== 'number') return;
        audio.currentTime = playableToReal(details.seekTime);
        activeEpisodeEnded = false;
        updateTransportUI();
      });
    } catch (e) { /* vom Browser nicht unterstützt */ }
  }
}

audio.addEventListener('play', () => {
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
  applyPlaybackRate(); // manche Browser setzen die Rate beim Laden zurück
  updatePlayPauseIcon();
});
audio.addEventListener('pause', () => {
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  updatePlayPauseIcon();
});

/* ============================================================
   WAKE LOCK - Bildschirm soll nicht einschlafen, solange die
   Seite sichtbar/aktiv ist (z.B. Handy im Autohalter).
   ============================================================ */

let wakeLock = null;

async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
  } catch (err) {
    console.error('Wake Lock nicht verfügbar:', err);
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
requestWakeLock();

/* ============================================================
   PLAYER-LEISTE: dynamisches Bottom-Padding
   Die Höhe der fixierten Player-Leiste kann je nach Gerät/Font-
   Skalierung variieren. Statt eines festen Paddings wird die
   tatsächliche Höhe laufend gemessen (ResizeObserver) und als
   Bottom-Padding auf <main> übertragen, damit die letzte Karte nie
   verdeckt wird.
   ============================================================ */

function syncMainPadding() {
  // Solange noch nichts abgespielt wurde, ist die Leiste unsichtbar - dann
  // braucht es auch keinen Platz dafür.
  const reserved = playerBar.classList.contains('visible') ? playerBar.offsetHeight + 24 : 24;
  mainEl.style.paddingBottom = reserved + 'px';
}

if ('ResizeObserver' in window) {
  new ResizeObserver(syncMainPadding).observe(playerBar);
} else {
  window.addEventListener('resize', syncMainPadding);
}
syncMainPadding();

/* ============================================================
   PLAYER-LEISTE AUSBLENDEN
   Wischt man nach oben (um einen anderen Podcast auszusuchen),
   fährt die Leiste nach unten weg und gibt die Kacheln frei.
   Sie kommt NICHT von selbst zurück - weder beim Weiterscrollen
   noch beim Runterwischen. Zurück kommt sie nur durch einen Tipp
   auf eine Kachel: auf die laufende (holt nur die Leiste zurück)
   oder auf eine andere (startet diesen Podcast).
   Dasselbe macht der Schliessen-Knopf (×) in der Leiste; die
   Wiedergabe läuft in beiden Fällen weiter.
   ============================================================ */

const SCROLL_HIDE_THRESHOLD_PX = 12; // Zittern beim Halten ignorieren
let lastScrollY = window.scrollY;

function hidePlayerBar() {
  playerBar.classList.add('scrolled-away');
}

function showPlayerBar() {
  playerBar.classList.remove('scrolled-away');
  lastScrollY = Math.max(0, window.scrollY); // sonst gilt der alte Stand als "nach oben"
}

function isPlayerBarHidden() {
  return playerBar.classList.contains('scrolled-away');
}

window.addEventListener('scroll', () => {
  const y = Math.max(0, window.scrollY);
  const delta = y - lastScrollY;
  if (Math.abs(delta) < SCROLL_HIDE_THRESHOLD_PX) return;
  lastScrollY = y;
  if (delta < 0) hidePlayerBar(); // Wischen nach oben -> Leiste weg
}, { passive: true });

const playerCloseBtn = document.getElementById('player-close');
if (playerCloseBtn) {
  playerCloseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    audio.pause();   // Schliessen heisst anhalten
    persistProgress(); // Position merken, damit es später weitergeht
    hidePlayerBar();
  });
}

/* ============================================================
   PWA: Service Worker registrieren (für "Zum Startbildschirm
   hinzufügen" unter Chrome/Android)
   ============================================================ */

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.error('Service Worker Registrierung fehlgeschlagen:', err);
    });
  });
}

/* Init */
migrateRenamedPodcasts();
renderTodayHeader();
applyPlaybackRate();
updatePlayPauseIcon();
updateEpisodeNavButtons();
getOrderedPodcasts().forEach(podcast => {
  const card = createCard(podcast);
  loadPodcast(podcast, card);
});
</script>
